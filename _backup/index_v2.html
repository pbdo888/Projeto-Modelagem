<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReciclaVerde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  /* ===== Identidade visual inspirada no menu do Wii U: branco, azul claro, vidro e blocos ===== */
  :root {
    --azul:#1aa3e8; --azul-escuro:#0b6fb0; --azul-claro:#e3f4ff;
    --tinta:#33465a; --suave:#7b8c9b; --linha:#dde7ef;
    --verde:#2fb24c; --amarelo:#ffcc1a; --laranja:#ff8a1f; --vermelho:#e5483d;
    --vidro:linear-gradient(180deg, rgba(255,255,255,.96) 0%, rgba(255,255,255,.82) 48%, rgba(238,247,255,.74) 52%, rgba(255,255,255,.9) 100%);
    --sombra:0 8px 24px rgba(25,80,125,.13), 0 1px 2px rgba(25,80,125,.08), inset 0 1px 0 #fff;
    --raio:24px;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    min-height:100vh; color:var(--tinta);
    font:15px/1.45 Nunito, "Segoe UI", system-ui, sans-serif;
    background:#f3f7fa repeating-linear-gradient(0deg, transparent 0 3px, rgba(140,170,195,.09) 3px 4px);
    padding-bottom:calc(120px + env(safe-area-inset-bottom, 0px));
  }
  h2, h3 { margin:0; letter-spacing:-.01em; }
  h2 { font-size:18px; font-weight:900; display:flex; align-items:center; gap:10px; }
  h3 { font-size:15px; font-weight:800; margin-bottom:10px; }
  .dica { margin:0 0 10px; color:var(--suave); font-size:13px; }
  [hidden] { display:none !important; }

  /* ---- barra superior ---- */
  .topo {
    position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px;
    padding:calc(10px + env(safe-area-inset-top, 0px)) 20px 10px;
    background:linear-gradient(180deg, #fff 0%, #f6fafd 55%, #eaf3fa 100%);
    border-bottom:1px solid #d3e1ec; box-shadow:0 2px 12px rgba(25,80,125,.08);
  }
  .logo { display:flex; align-items:center; gap:10px; font-size:22px; font-weight:900; color:var(--azul-escuro); }
  .logo .selo {
    width:40px; height:40px; border-radius:13px; display:grid; place-items:center;
    background:linear-gradient(180deg, #6fdc7f 0%, #2fb24c 50%, #229a3d 51%, #34ba52 100%);
    box-shadow:0 3px 0 #1c7f33, inset 0 1px 0 rgba(255,255,255,.7);
  }
  .chip {
    margin-left:auto; display:flex; align-items:center; gap:10px; padding:5px 14px 5px 5px;
    border-radius:999px; background:var(--vidro); box-shadow:var(--sombra); font-weight:800;
  }
  .chip .mini { width:34px; height:34px; border-radius:50%; background:var(--azul-claro); display:grid; place-items:center; overflow:hidden; }
  .chip small { display:block; color:var(--suave); font-weight:600; font-size:12px; line-height:1.1; }

  /* ---- grade de blocos ---- */
  main {
    max-width:1280px; margin:0 auto; padding:20px; display:grid; gap:20px;
    grid-template-columns:minmax(0, 1fr) 350px;
    grid-template-areas:"mapa lado" "mundo mundo" "admin admin";
  }
  .bloco {
    position:relative; padding:18px; border-radius:var(--raio);
    background:var(--vidro); border:1px solid rgba(255,255,255,.95); box-shadow:var(--sombra);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  }
  .cab-bloco { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .ico { width:14px; height:14px; border-radius:50%; flex:none; background:var(--azul); box-shadow:0 0 0 4px var(--azul-claro); }
  .ico.verde { background:var(--verde); box-shadow:0 0 0 4px #ddf5e1; }
  .ico.amarelo { background:var(--amarelo); box-shadow:0 0 0 4px #fff3c4; }
  .ico.laranja { background:var(--laranja); box-shadow:0 0 0 4px #ffe6d0; }

  .lado { grid-area:lado; display:flex; flex-direction:column; gap:20px; }
  .mapa-moldura { grid-area:mapa; padding:10px; display:flex; flex-direction:column; }
  .mapa-moldura .cab-bloco { padding:6px 8px 0; margin-bottom:10px; }
  #map {
    flex:1; min-height:440px; border-radius:18px; overflow:hidden; background:var(--azul-claro);
    box-shadow:inset 0 0 0 1px #d3e1ec, 0 2px 8px rgba(25,80,125,.1);
  }
  .mapa-vazio { height:100%; display:grid; place-items:center; padding:30px; text-align:center; color:var(--suave); font-weight:700; }
  .legenda { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; font-weight:700; color:var(--suave); }
  .legenda i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px; }

  /* ---- botões e campos glossy ---- */
  .btn {
    appearance:none; border:0; cursor:pointer; font:inherit; font-weight:800; color:#fff; white-space:nowrap;
    padding:11px 22px; border-radius:999px;
    background:linear-gradient(180deg, #66ccff 0%, #22a8ee 50%, #0e92da 51%, #1aa3e8 100%);
    box-shadow:0 4px 0 var(--azul-escuro), 0 8px 16px rgba(14,146,218,.28), inset 0 1px 0 rgba(255,255,255,.65);
    text-shadow:0 1px 0 rgba(0,0,0,.18); transition:transform .08s, box-shadow .08s, filter .15s;
  }
  .btn:hover { filter:brightness(1.06); }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 var(--azul-escuro), 0 3px 8px rgba(14,146,218,.25), inset 0 1px 0 rgba(255,255,255,.65); }
  .btn.verde { background:linear-gradient(180deg, #74e086 0%, #35bd52 50%, #25a142 51%, #31b44e 100%); box-shadow:0 4px 0 #1b7a31, 0 8px 16px rgba(47,178,76,.28), inset 0 1px 0 rgba(255,255,255,.65); }
  .btn.branco { color:var(--azul-escuro); text-shadow:none; background:linear-gradient(180deg, #fff 0%, #f6fafd 50%, #e8f1f8 51%, #fff 100%); box-shadow:0 4px 0 #c6d6e3, 0 6px 12px rgba(25,80,125,.12), inset 0 1px 0 #fff; }
  .btn.pequeno { padding:7px 16px; font-size:13px; }
  .btn.largo { width:100%; }
  .btn:disabled { cursor:not-allowed; filter:none; transform:none; color:#8796a3; text-shadow:none; background:linear-gradient(180deg, #f2f5f8, #e3e9ee); box-shadow:0 3px 0 #ccd6de; }
  input, select {
    width:100%; margin-bottom:10px; padding:11px 16px; font:inherit; color:var(--tinta);
    border:1px solid #cfdde8; border-radius:16px; background:#fff;
    box-shadow:inset 0 2px 4px rgba(25,80,125,.08);
  }
  :focus-visible { outline:3px solid #8fd6ff; outline-offset:2px; }

  /* ---- perfil e máquinas ---- */
  .perfil-topo { display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  .perfil-topo .mini { width:58px; height:58px; border-radius:18px; display:grid; place-items:center; background:linear-gradient(180deg, #e8f6ff, #cfeaff); box-shadow:inset 0 1px 0 #fff, 0 2px 6px rgba(25,80,125,.12); }
  .perfil-topo b { font-size:18px; font-weight:900; display:block; }
  .numeros { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .numero { padding:10px 12px; border-radius:16px; background:#fff; box-shadow:inset 0 0 0 1px var(--linha); }
  .numero b { display:block; font-size:22px; font-weight:900; color:var(--azul-escuro); line-height:1.1; }
  .numero small { color:var(--suave); font-weight:700; font-size:12px; }
  .link { background:none; border:0; padding:0; font:inherit; font-weight:800; color:var(--azul-escuro); cursor:pointer; }

  .tiles { display:flex; flex-direction:column; gap:10px; }
  .tile {
    display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:18px;
    background:#fff; box-shadow:inset 0 0 0 1px var(--linha), 0 2px 0 #e6eef4;
  }
  .tile.destaque { box-shadow:inset 0 0 0 2px var(--verde), 0 3px 0 #bfe8c8; }
  .tile .num { width:34px; height:34px; flex:none; border-radius:12px; display:grid; place-items:center; font-weight:900; color:#fff; background:linear-gradient(180deg, #74e086, #2fb24c); }
  .tile .info { flex:1; min-width:0; }
  .tile .info b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tile .info small { color:var(--suave); font-weight:600; }
  .pilula { flex:none; padding:4px 10px; border-radius:999px; font-weight:900; font-size:13px; color:var(--azul-escuro); background:var(--azul-claro); }
  .ocupa { height:6px; margin-top:4px; border-radius:3px; background:#e8eef3; overflow:hidden; }
  .ocupa i { display:block; height:100%; border-radius:3px; background:var(--verde); }

  /* ===== Mundo de cupons (mapa de fases) ===== */
  .mundo { grid-area:mundo; }
  .cena {
    position:relative; height:300px; overflow-x:auto; overflow-y:hidden; border-radius:18px;
    background:linear-gradient(180deg, #7ccdfc 0%, #b9e5ff 65%, #dff3ff 100%);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.06), inset 0 -2px 0 rgba(255,255,255,.4);
    scrollbar-width:thin;
  }
  .trilho {
    position:relative; height:100%; min-width:100%;
    background:
      radial-gradient(ellipse 50% 100% at 50% 100%, #57c95a 0 97%, #3ea844 98% 100%, transparent 101%) 0 calc(100% - 34px) / 300px 110px repeat-x,
      radial-gradient(ellipse 50% 100% at 50% 100%, #8fe08a 0 97%, transparent 100%) 150px calc(100% - 34px) / 300px 70px repeat-x;
  }
  .trilho::after {   /* chão de tijolos */
    content:""; position:absolute; left:0; right:0; bottom:0; height:34px;
    background:
      linear-gradient(180deg, #5bd15f 0 6px, #36a03c 6px 9px, transparent 9px),
      repeating-linear-gradient(180deg, transparent 0 21px, #8f4a1d 21px 23px),
      repeating-linear-gradient(90deg, #c8743a 0 30px, #8f4a1d 30px 32px);
  }
  .nuvem {
    position:absolute; width:70px; height:22px; border-radius:22px; background:#fff; opacity:.95;
    box-shadow:18px -10px 0 4px #fff, 40px -2px 0 0 #fff;
  }
  .caminho { position:absolute; inset:0; z-index:1; }
  .caminho polyline { fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .caminho .borda { stroke:#e9cf9b; stroke-width:18; }
  .caminho .feito { stroke:#ffd84a; stroke-width:10; }
  .caminho .tracejado { stroke:#fff; stroke-width:4; stroke-dasharray:1 13; }

  .fase {
    position:absolute; z-index:3; width:58px; height:58px; margin:-29px 0 0 -29px; padding:0;
    border-radius:50%; border:4px solid #fff; cursor:pointer;
    font:900 20px Nunito, "Segoe UI", sans-serif; color:#fff; display:grid; place-items:center;
    background:linear-gradient(180deg, #c8d3dc 0%, #a9b6c1 50%, #95a3af 51%, #b2bec8 100%);
    box-shadow:0 5px 0 rgba(0,0,0,.18), 0 9px 16px rgba(0,0,0,.16), inset 0 2px 0 rgba(255,255,255,.6);
    transition:transform .15s;
  }
  .fase:hover { transform:scale(1.08); }
  .fase.liberada { color:#8a5a00; background:linear-gradient(180deg, #ffe873 0%, #ffcc1a 50%, #f2b400 51%, #ffd84a 100%); }
  .fase.inicio { cursor:default; color:#fff; background:linear-gradient(180deg, #66ccff 0%, #22a8ee 50%, #0e92da 51%, #1aa3e8 100%); }
  .fase.inicio:hover { transform:none; }
  .fase.proxima { animation:chamar 1.6s ease-in-out infinite; }
  .fase.selecionada { outline:4px solid var(--azul); outline-offset:3px; }
  .fase.resgatada::after {
    content:"★"; position:absolute; top:-12px; right:-12px; width:26px; height:26px; border-radius:50%;
    display:grid; place-items:center; font-size:14px; color:#fff; background:var(--azul); border:3px solid #fff;
  }
  .fase.festa { animation:festa .7s ease-out; }
  .fase span {
    position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%); white-space:nowrap;
    padding:2px 10px; border-radius:999px; font-size:12px; font-weight:800; color:var(--tinta);
    background:rgba(255,255,255,.92); box-shadow:0 1px 3px rgba(0,0,0,.12);
  }
  .bandeira { position:absolute; z-index:2; bottom:34px; width:4px; height:130px; background:#5b6b78; border-radius:2px; }
  .bandeira::before { content:""; position:absolute; left:4px; top:6px; border-left:42px solid var(--verde); border-top:16px solid transparent; border-bottom:16px solid transparent; }
  .bandeira::after { content:""; position:absolute; left:-6px; top:-12px; width:16px; height:16px; border-radius:50%; background:var(--amarelo); box-shadow:inset -2px -2px 0 #e0a800; }

  .avatar { position:absolute; left:0; top:0; z-index:5; width:36px; height:48px; pointer-events:none; filter:drop-shadow(0 3px 0 rgba(0,0,0,.18)); }
  .avatar svg { display:block; transform-origin:50% 100%; }
  .avatar.andando svg { animation:passo .28s steps(2) infinite; }
  .moeda {
    position:absolute; z-index:6; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff6b0, #ffcc1a 55%, #e0a800); border:2px solid #b98600;
    animation:moeda .9s ease-out forwards; pointer-events:none;
  }
  @keyframes passo { 0% { transform:translateY(0) rotate(-4deg); } 100% { transform:translateY(-4px) rotate(4deg); } }
  @keyframes festa { 0% { transform:scale(1); } 35% { transform:scale(1.4); } 100% { transform:scale(1); } }
  @keyframes chamar { 0%, 100% { box-shadow:0 5px 0 rgba(0,0,0,.18), 0 0 0 0 rgba(26,163,232,.55); } 50% { box-shadow:0 5px 0 rgba(0,0,0,.18), 0 0 0 12px rgba(26,163,232,0); } }
  @keyframes moeda { 0% { transform:translateY(0) scale(.6); opacity:1; } 100% { transform:translateY(-70px) scale(1.1); opacity:0; } }

  .fase-info {
    display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-top:14px; padding:14px 16px;
    border-radius:18px; background:#fff; box-shadow:inset 0 0 0 1px var(--linha);
  }
  .fase-info .txt { flex:1; min-width:220px; }
  .fase-info .txt b { font-size:16px; font-weight:900; }
  .fase-info .txt small { display:block; color:var(--suave); font-weight:700; }
  .selo-fase { flex:none; padding:6px 12px; border-radius:12px; font-weight:900; color:#fff; background:var(--azul); }

  /* ---- painel admin ---- */
  .admin { grid-area:admin; }
  .admin-grade { display:grid; gap:14px; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); }
  .cartao { padding:16px; border-radius:18px; background:#fff; box-shadow:inset 0 0 0 1px var(--linha); }
  .cartao.largo { grid-column:span 2; }
  .segmento { display:flex; padding:4px; border-radius:999px; background:#eef4f9; box-shadow:inset 0 1px 3px rgba(25,80,125,.12); margin-bottom:10px; }
  .segmento label { flex:1; }
  .segmento input { position:absolute; opacity:0; width:1px; height:1px; margin:0; }
  .segmento span { display:block; padding:8px 10px; border-radius:999px; text-align:center; font-weight:800; font-size:13px; color:var(--suave); cursor:pointer; }
  .segmento input:checked + span { color:#fff; background:linear-gradient(180deg, #66ccff, #1aa3e8); box-shadow:0 2px 0 var(--azul-escuro); }
  .segmento input:focus-visible + span { outline:3px solid #8fd6ff; }
  .tabela { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:7px 8px; text-align:right; border-bottom:1px solid var(--linha); font-variant-numeric:tabular-nums; }
  th { color:var(--suave); font-weight:800; }
  th:first-child, td:first-child { text-align:left; }
  .barra-mat { margin-bottom:10px; font-size:13px; font-weight:700; }
  .barra-mat div { display:flex; justify-content:space-between; }
  .barra-mat i { display:block; height:10px; margin-top:3px; border-radius:5px; background:linear-gradient(90deg, #66ccff, #1aa3e8); }

  /* ---- dock inferior (estilo GamePad) ---- */
  .dock {
    position:fixed; z-index:30; left:50%; transform:translateX(-50%);
    bottom:calc(14px + env(safe-area-inset-bottom, 0px));
    display:flex; gap:10px; padding:10px 14px; border-radius:999px;
    background:var(--vidro); border:1px solid #fff; box-shadow:0 10px 30px rgba(25,80,125,.22), inset 0 1px 0 #fff;
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  }
  .dock button {
    width:74px; height:66px; border:0; border-radius:22px; cursor:pointer; font:inherit;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    font-size:11px; font-weight:800; color:var(--azul-escuro);
    background:linear-gradient(180deg, #fff 0%, #f5f9fc 50%, #e7f0f7 51%, #fbfdfe 100%);
    box-shadow:0 3px 0 #c6d6e3, inset 0 1px 0 #fff; transition:transform .08s;
  }
  .dock button:active { transform:translateY(2px); box-shadow:0 1px 0 #c6d6e3; }
  .dock button.ativo { color:#fff; background:linear-gradient(180deg, #ffb066 0%, #ff8a1f 50%, #f07400 51%, #ff9433 100%); box-shadow:0 3px 0 #b85600; }
  .dock svg { width:24px; height:24px; }

  /* ---- avisos e diálogos ---- */
  #avisos { position:fixed; z-index:50; top:calc(76px + env(safe-area-inset-top, 0px)); right:16px; display:flex; flex-direction:column; gap:8px; max-width:min(360px, calc(100vw - 32px)); }
  .aviso {
    padding:12px 18px; border-radius:18px; font-weight:800; background:var(--vidro); border-left:6px solid var(--verde);
    box-shadow:0 8px 24px rgba(25,80,125,.2); animation:entrar .25s ease-out; transition:opacity .4s, transform .4s;
  }
  .aviso.erro { border-left-color:var(--vermelho); }
  .aviso.saindo { opacity:0; transform:translateX(20px); }
  @keyframes entrar { from { opacity:0; transform:translateY(-10px); } }
  dialog {
    width:min(420px, calc(100vw - 32px)); padding:24px; border:1px solid #fff; border-radius:28px;
    background:var(--vidro); color:var(--tinta); box-shadow:0 20px 60px rgba(25,80,125,.3);
  }
  dialog::backdrop { background:rgba(200,225,245,.55); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
  dialog h2 { margin-bottom:10px; }
  .acoes { display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:6px; }
  .codigo { margin:12px 0 16px; padding:16px; border-radius:18px; text-align:center; font-size:30px; font-weight:900; letter-spacing:.12em; color:var(--azul-escuro); background:#fff; box-shadow:inset 0 0 0 2px var(--azul-claro); }

  @media (max-width:900px) {
    main { grid-template-columns:minmax(0, 1fr); grid-template-areas:"lado" "mapa" "mundo" "admin"; padding:16px; }
    #map { min-height:360px; }
    .cartao.largo { grid-column:auto; }
    .chip small { display:none; }
  }
  @media (max-width:480px) {
    .logo span { display:none; }
    .dock { gap:6px; padding:8px 10px; }
    .dock button { width:62px; height:58px; font-size:10px; }
  }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<header class="topo">
  <div class="logo">
    <div class="selo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 19H4.8a2 2 0 0 1-1.7-3l1.6-2.8M11 4.5l1-1.7a2 2 0 0 1 3.4 0l3 5.2M17 19h3.2a2 2 0 0 0 1.7-3l-1.3-2.2"/><path d="m13 16-2.5 3L13 22M5.5 9.5 4.7 13.3l3.8.8M16 6l3.7 1.9-1.9 3.6"/></svg></div>
    <span>ReciclaVerde</span>
  </div>
  <div class="chip" id="chip" hidden></div>
</header>

<main>
  <section class="bloco mapa-moldura" id="secMapa">
    <div class="cab-bloco">
      <h2><i class="ico"></i>Mapa de máquinas</h2>
      <div class="legenda"><span><i style="background:#1a73e8"></i>Você</span><span><i style="background:#2fb24c"></i>Máquina</span><span><i style="background:#ff8a1f"></i>Nova máquina</span></div>
    </div>
    <div id="map"><div class="mapa-vazio">Carregando o Google Maps…</div></div>
  </section>

  <div class="lado">
    <section class="bloco">
      <div id="login">
        <h2 style="margin-bottom:12px"><i class="ico verde"></i>Entrar</h2>
        <form id="formLogin">
          <input id="email" type="email" placeholder="seu e-mail" autocomplete="email" required>
          <input id="nome" placeholder="seu nome (só no primeiro acesso)" autocomplete="name">
          <button class="btn verde largo">Entrar</button>
        </form>
      </div>
      <div id="perfil" hidden></div>
    </section>

    <section class="bloco">
      <h2 style="margin-bottom:12px"><i class="ico"></i>Máquinas mais próximas</h2>
      <div id="proxima" class="dica">Permita a localização ou clique no mapa para dizer onde você está.</div>
    </section>
  </div>

  <section class="bloco mundo" id="secMundo">
    <div class="cab-bloco">
      <h2><i class="ico amarelo"></i>Mundo de cupons</h2>
      <span class="dica" style="margin:0" id="mundoResumo"></span>
    </div>
    <div class="cena" id="cena"><div class="trilho" id="trilho"></div></div>
    <div class="fase-info" id="faseInfo"></div>
  </section>

  <!-- Vazio para usuários comuns: o conteúdo vem de /api/admin/painel só com token válido -->
  <section class="bloco admin" id="admin" hidden></section>
</main>

<nav class="dock" aria-label="Atalhos">
  <button onclick="usarLocalizacao()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Localizar</button>
  <button onclick="irPara('secMapa')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>Mapa</button>
  <button onclick="irPara('secMundo')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7L12 3Z"/></svg>Fases</button>
  <button id="btnAdmin" onclick="abrirAdmin()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Admin</button>
</nav>

<div id="avisos" aria-live="polite"></div>

<dialog id="dlgAdmin">
  <h2><i class="ico laranja"></i>Modo administrador</h2>
  <p class="dica">Informe o token de administrador para abrir o painel.</p>
  <form id="formAdmin">
    <input id="token" type="password" placeholder="token de admin" autocomplete="off" required>
    <div class="acoes">
      <button type="button" class="btn branco" onclick="$('dlgAdmin').close()">Cancelar</button>
      <button class="btn">Entrar</button>
    </div>
  </form>
</dialog>

<dialog id="dlgCodigo">
  <h2><i class="ico verde"></i>Cupom resgatado!</h2>
  <p class="dica" id="codigoMarca"></p>
  <div class="codigo" id="codigo"></div>
  <div class="acoes"><button class="btn" onclick="$('dlgCodigo').close()">Fechar</button></div>
</dialog>

<script>
let map, AME, Pin, me, rota, userPos, novoPonto, novoPino, user, nearest, progresso, pinos = [];
let adminToken = null, pontosMundo = [], faseSel = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tentar = fn => async (...a) => { try { await fn(...a); } catch (e) { aviso(e.message, 'erro'); } };
const semMovimento = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const guardar = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };
const ler = k => { try { return localStorage.getItem(k); } catch { return null; } };

function aviso(msg, tipo = 'ok') {
  const d = document.createElement('div');
  d.className = 'aviso ' + tipo;
  d.textContent = msg;
  $('avisos').append(d);
  setTimeout(() => d.classList.add('saindo'), 3200);
  setTimeout(() => d.remove(), 3700);
}

async function api(url, body, admin) {
  const headers = {'Content-Type': 'application/json'};
  if (admin) headers['X-Admin-Token'] = adminToken || '';
  const r = await fetch(url, body ? {method: 'POST', headers, body: JSON.stringify(body)} : {headers});
  const j = await r.json().catch(() => ({}));
  if (admin && r.status === 401) sairAdmin(true);
  if (!r.ok) throw new Error(j.erro || 'Erro inesperado');
  return j;
}

function irPara(id) { $(id).scrollIntoView({behavior: semMovimento() ? 'auto' : 'smooth', block: 'start'}); }

/* ---------- avatar em pixel art (12x16), desenhado em SVG ---------- */
const SPRITE = (() => {
  const px = [
    '...GGGGG....', '..GGGGWGGGG.', '..HHHSSKS...', '.HSHSSSKSSS.',
    '.HSHHSSSKSSS', '.HHSSSSKKKK.', '...SSSSSSS..', '..GGBGGG....',
    '.GGGBGGBGGG.', 'GGGGBBBBGGGG', 'SSGBYBBYBGSS', 'SSSBBBBBBSSS',
    'SSBBBBBBBBSS', '..BBB..BBB..', '.OOO....OOO.', 'OOOO....OOOO'];
  const cor = {G:'#2fb24c', W:'#fff', H:'#6b3e1f', S:'#f6c9a0', K:'#1d1d1d', B:'#1e7fd8', Y:'#ffd21f', O:'#7a4320'};
  let r = '';
  px.forEach((linha, y) => [...linha].forEach((c, x) => {
    if (cor[c]) r += `<rect x="${x}" y="${y}" width="1.04" height="1.04" fill="${cor[c]}"/>`;
  }));
  return w => `<svg viewBox="0 0 12 16" width="${w}" height="${w * 4 / 3}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
})();
const CADEADO = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="#fff"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

/* ---------- Google Maps ---------- */
function marcador(pos, cor, titulo) {
  const pin = new Pin({background: cor, borderColor: '#fff', glyphColor: '#fff'});
  return new AME({map, position: pos, title: titulo, content: pin.element ?? pin});
}

async function carregarMaquinas() {
  if (!map) return;
  pinos.forEach(p => p.map = null);
  pinos = (await api('/api/maquinas')).map(m => marcador({lat: m.lat, lng: m.lng}, '#2fb24c', m.nome));
}

async function definirPosicao(lat, lng) {
  userPos = {lat, lng};
  if (map) {
    if (me) me.map = null;
    me = marcador(userPos, '#1a73e8', 'Você está aqui');
  }
  await atualizarProxima(true);
}

function usarLocalizacao() {
  if (!navigator.geolocation) return aviso('Seu navegador não informa a localização. Clique no mapa.', 'erro');
  navigator.geolocation.getCurrentPosition(
    p => tentar(definirPosicao)(p.coords.latitude, p.coords.longitude),
    () => aviso('Não foi possível obter sua localização. Clique no mapa para indicar onde você está.', 'erro'));
}

async function atualizarProxima(ajustar) {
  if (!userPos) return;
  const lista = await api(`/api/maquinas/proximas?lat=${userPos.lat}&lng=${userPos.lng}`);
  nearest = lista[0];
  $('proxima').className = 'tiles';
  $('proxima').innerHTML = lista.map((m, i) => {
    const pct = Math.round(100 * m.ocupacao / m.capacidade);
    return `<div class="tile ${i ? '' : 'destaque'}"><div class="num">${i + 1}</div>
      <div class="info"><b>${esc(m.nome)}</b><small>${i ? '' : 'Mais próxima · '}${esc(m.bairro)} · ${pct}% cheia</small>
      <div class="ocupa"><i style="width:${pct}%;${pct > 80 ? 'background:var(--laranja)' : ''}"></i></div></div>
      <span class="pilula">${m.distancia_km} km</span></div>`;
  }).join('');
  if (!map) return;
  const alvo = {lat: nearest.lat, lng: nearest.lng};
  if (rota) rota.setMap(null);
  rota = new google.maps.Polyline({   // linha reta = distância euclidiana usada no cálculo
    map, path: [userPos, alvo], strokeOpacity: 0,
    icons: [{icon: {path: 'M 0,-1 0,1', strokeOpacity: 1, strokeColor: '#1aa3e8', strokeWeight: 4, scale: 3}, offset: '0', repeat: '14px'}]});
  if (ajustar) {
    const b = new google.maps.LatLngBounds();
    b.extend(userPos);
    b.extend(alvo);
    map.fitBounds(b, 80);
  }
}

async function initMap() {
  const {Map} = await google.maps.importLibrary('maps');
  ({AdvancedMarkerElement: AME, PinElement: Pin} = await google.maps.importLibrary('marker'));
  map = new Map($('map'), {
    center: {lat: -23.5505, lng: -46.6333}, zoom: 12, mapId: 'DEMO_MAP_ID',
    disableDefaultUI: true, zoomControl: true, fullscreenControl: true, clickableIcons: false});
  map.addListener('click', tentar(async e => {
    const p = {lat: e.latLng.lat(), lng: e.latLng.lng()};
    const modo = document.querySelector('input[name=cliqueModo]:checked')?.value;
    if (adminToken && modo === 'maquina') {
      novoPonto = p;
      if (novoPino) novoPino.map = null;
      novoPino = marcador(p, '#ff8a1f', 'Nova máquina');
      if ($('m_local')) $('m_local').textContent = `${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`;
    } else {
      await definirPosicao(p.lat, p.lng);
    }
  }));
  await carregarMaquinas();
  if (userPos) await definirPosicao(userPos.lat, userPos.lng);
  else usarLocalizacao();
}
window.gm_authFailure = () => aviso('Falha ao autenticar no Google Maps. Confira a GOOGLE_MAPS_API_KEY no .env.', 'erro');

/* ---------- usuário ---------- */
async function carregarUsuario(id) {
  const p = await api(`/api/usuarios/${id}/progresso`);
  const anterior = ler('fase_' + p.usuario.id);
  progresso = p;
  user = p.usuario;
  guardar('uid', user.id);
  guardar('fase_' + user.id, p.fase_atual);
  $('login').hidden = true;
  $('perfil').hidden = false;
  $('perfil').innerHTML = `
    <div class="perfil-topo"><div class="mini">${SPRITE(30)}</div>
      <div><b>${esc(user.nome)}</b><small class="dica">${esc(user.email)}</small></div></div>
    <div class="numeros">
      <div class="numero"><b>${user.pontos}</b><small>pontos de saldo</small></div>
      <div class="numero"><b>${p.fase_atual}/${p.fases.length}</b><small>fases liberadas</small></div>
    </div>
    <button class="link" onclick="sair()">Sair da conta</button>`;
  $('chip').hidden = false;
  $('chip').innerHTML = `<div class="mini">${SPRITE(22)}</div><div>${esc(user.nome.split(' ')[0])}<small>${user.pontos} pontos</small></div>`;
  // primeira visita neste navegador: sem animação; depois, anda das fases antigas até a atual
  const de = anterior == null ? p.fase_atual : Math.min(+anterior, p.fase_atual);
  await desenharMundo(p.fases, de, p.fase_atual);
}

async function carregarVisitante() {
  progresso = null;
  const fases = (await api('/api/cupons')).map((c, i) => ({...c, fase: i + 1, liberada: false, resgatavel: false, resgates: 0}));
  await desenharMundo(fases, 0, 0);
}

function sair() {
  guardar('uid', null);
  user = null;
  $('perfil').hidden = true;
  $('chip').hidden = true;
  $('login').hidden = false;
  carregarVisitante();
}

/* ---------- mundo de cupons ---------- */
const PASSO = 140, MARGEM = 80;
const posFase = i => ({x: MARGEM + i * PASSO, y: 150 - Math.round(Math.sin(i * 1.15) * 55)});
const posAvatar = q => `translate(${q.x - 18}px, ${q.y - 29 - 44}px)`;
let fasesAtuais = [];

async function desenharMundo(fases, de, ate) {
  fasesAtuais = fases;
  pontosMundo = [posFase(0), ...fases.map((_, i) => posFase(i + 1))];
  const ultimo = pontosMundo[pontosMundo.length - 1];
  const largura = ultimo.x + 140;
  const linha = pontosMundo.map(q => `${q.x},${q.y}`).join(' ');
  let nuvens = '';
  for (let i = 0; i * 260 < largura; i++) nuvens += `<div class="nuvem" style="left:${40 + i * 260 + (i % 3) * 35}px;top:${24 + (i % 2) * 34}px"></div>`;

  // as fases entre "de" e "ate" começam trancadas e são liberadas enquanto o avatar anda
  $('trilho').style.width = largura + 'px';
  $('trilho').innerHTML = nuvens +
    `<svg class="caminho" width="${largura}" height="300" aria-hidden="true">
       <polyline class="borda" points="${linha}"/><polyline class="feito" id="feito"/><polyline class="tracejado" points="${linha}"/></svg>
     <div class="fase inicio" style="left:${pontosMundo[0].x}px;top:${pontosMundo[0].y}px">★<span>Início</span></div>` +
    fases.map((f, i) => {
      const q = pontosMundo[i + 1], lib = i < de;
      return `<button class="fase ${lib ? 'liberada' : ''} ${f.resgates ? 'resgatada' : ''}" data-i="${i}"
        style="left:${q.x}px;top:${q.y}px" aria-label="Fase ${i + 1}: ${esc(f.marca)}" onclick="mostrarFase(${i})">
        ${lib ? i + 1 : CADEADO}<span>${esc(f.marca)}</span></button>`;
    }).join('') +
    `<div class="bandeira" style="left:${ultimo.x + 70}px"></div>
     <div class="avatar" id="avatar">${SPRITE(36)}</div>`;
  marcarFeito(de);
  marcarProxima(de);
  $('avatar').style.transform = posAvatar(pontosMundo[de]);
  centralizar(pontosMundo[de].x, false);
  mostrarFase(null);
  if (ate > de) {
    irPara('secMundo');
    await andar(de, ate);
  }
}

const marcarFeito = n => $('feito').setAttribute('points', pontosMundo.slice(0, n + 1).map(q => `${q.x},${q.y}`).join(' '));

function marcarProxima(n) {
  document.querySelectorAll('.fase.proxima').forEach(e => e.classList.remove('proxima'));
  document.querySelector(`.fase[data-i="${n}"]`)?.classList.add('proxima');
}

function centralizar(x, suave) {
  const cena = $('cena');
  cena.scrollTo({left: x - cena.clientWidth / 2, behavior: suave && !semMovimento() ? 'smooth' : 'auto'});
}

async function andar(de, ate) {
  const av = $('avatar');
  av.classList.add('andando');
  for (let k = de + 1; k <= ate; k++) {
    const a = pontosMundo[k - 1], b = pontosMundo[k];
    centralizar(b.x, true);
    if (!semMovimento()) {
      const anim = av.animate([{transform: posAvatar(a)}, {transform: posAvatar(b)}],
                              {duration: 900, easing: 'ease-in-out', fill: 'forwards'});
      await anim.finished;
      av.style.transform = posAvatar(b);
      anim.cancel();
    } else {
      av.style.transform = posAvatar(b);
    }
    marcarFeito(k);
    marcarProxima(k);
    const no = document.querySelector(`.fase[data-i="${k - 1}"]`);
    no.classList.add('liberada', 'festa');
    no.firstChild.replaceWith(String(k));
    no.querySelector('svg')?.remove();
    const moeda = document.createElement('div');
    moeda.className = 'moeda';
    moeda.style.cssText = `left:${b.x}px;top:${b.y - 40}px`;
    $('trilho').append(moeda);
    setTimeout(() => moeda.remove(), 1000);
    aviso(`Fase ${k} liberada: ${fasesAtuais[k - 1].marca}!`);
  }
  av.classList.remove('andando');
  mostrarFase(null);
}

function mostrarFase(i) {
  document.querySelectorAll('.fase.selecionada').forEach(e => e.classList.remove('selecionada'));
  const info = $('faseInfo');
  const n = progresso ? progresso.fase_atual : 0;
  $('mundoResumo').textContent = fasesAtuais.length ? `${n} de ${fasesAtuais.length} fases liberadas` : '';
  if (i == null) {
    if (!fasesAtuais.length) {
      info.innerHTML = '<div class="txt"><b>Nenhum cupom cadastrado ainda.</b></div>';
    } else if (!user) {
      info.innerHTML = '<div class="txt"><b>Entre na sua conta para começar a jornada.</b><small>Cada fase é um cupom de uma marca parceira. Recicle para avançar!</small></div>';
    } else if (progresso.proximo_cupom) {
      const c = progresso.proximo_cupom;
      info.innerHTML = `<span class="selo-fase">Fase ${c.fase}</span><div class="txt">
        <b>Faltam ${progresso.faltam_pontos} pontos para liberar ${esc(c.marca)}</b>
        <small>Cerca de ${progresso.faltam_itens} itens reciclados · ${progresso.pontos_totais} pontos acumulados. Toque numa fase para ver o cupom.</small></div>`;
    } else {
      info.innerHTML = '<span class="selo-fase" style="background:var(--verde)">Completo</span><div class="txt"><b>Você liberou todas as fases!</b><small>Toque numa fase para resgatar o cupom.</small></div>';
    }
    return;
  }
  const f = fasesAtuais[i];
  const liberada = user && i < n;
  document.querySelector(`.fase[data-i="${i}"]`)?.classList.add('selecionada');
  let acao;
  if (!user) acao = '<button class="btn pequeno" onclick="$(\'email\').focus()">Entrar para jogar</button>';
  else if (!liberada) acao = `<small class="dica" style="margin:0">Faltam ${f.custo - progresso.pontos_totais} pontos acumulados</small>`;
  else if (f.resgatavel) acao = `<button class="btn verde" onclick="resgatar(${f.id})">Resgatar por ${f.custo} pontos</button>`;
  else acao = `<small class="dica" style="margin:0">Saldo insuficiente (${user.pontos} de ${f.custo} pontos)</small>`;
  info.innerHTML = `<span class="selo-fase" style="${liberada ? 'background:var(--amarelo);color:#8a5a00' : 'background:#a9b6c1'}">Fase ${i + 1}</span>
    <div class="txt"><b>${esc(f.marca)}: ${esc(f.descricao)}</b>
    <small>${liberada ? 'Fase liberada' : 'Fase trancada'} · custa ${f.custo} pontos${f.resgates ? ` · resgatado ${f.resgates}x` : ''}</small></div>${acao}`;
}

/* ---------- admin (o painel só existe na página depois de validar o token no servidor) ---------- */
function abrirAdmin() {
  if (adminToken) return irPara('admin');
  $('token').value = '';
  $('dlgAdmin').showModal();
}

async function entrarAdmin(token, silencioso) {
  const r = await fetch('/api/admin/painel', {headers: {'X-Admin-Token': token}});
  if (!r.ok) {
    try { sessionStorage.removeItem('adminToken'); } catch {}
    if (!silencioso) throw new Error('Token de administrador inválido.');
    return;
  }
  adminToken = token;
  try { sessionStorage.setItem('adminToken', token); } catch {}
  $('admin').innerHTML = await r.text();
  $('admin').hidden = false;
  $('btnAdmin').classList.add('ativo');
  await carregarAnalise();
  if (!silencioso) { aviso('Modo administrador ativado.'); irPara('admin'); }
}

function sairAdmin(expirou) {
  adminToken = null;
  try { sessionStorage.removeItem('adminToken'); } catch {}
  $('admin').innerHTML = '';
  $('admin').hidden = true;
  $('btnAdmin').classList.remove('ativo');
  if (novoPino) novoPino.map = null;
  novoPino = novoPonto = null;
  aviso(expirou ? 'Sessão de administrador inválida.' : 'Modo administrador encerrado.', expirou ? 'erro' : 'ok');
}

async function carregarAnalise() {
  if (!adminToken) return;
  const a = await api('/api/analise', null, true);
  $('analise').innerHTML = '<tr><th>Bairro</th><th>Máquinas</th><th>Depósitos</th><th>Itens</th><th>Pontos</th><th>Usuários</th></tr>' +
    a.por_bairro.map(b => `<tr><td>${esc(b.bairro)}</td><td>${b.maquinas}</td><td>${b.depositos}</td><td>${b.itens}</td><td>${b.pontos}</td><td>${b.usuarios}</td></tr>`).join('');
  const max = Math.max(1, ...a.por_material.map(m => m.itens));
  $('por_material').innerHTML = a.por_material.map(m =>
    `<div class="barra-mat"><div><span>${esc(m.material).toUpperCase()}</span><span>${m.itens}</span></div><i style="width:${100 * m.itens / max}%"></i></div>`).join('');
}

const novaMaquina = tentar(async () => {
  if (!novoPonto) throw new Error('Clique no mapa (modo "Nova máquina") para escolher o local.');
  await api('/api/maquinas', {nome: $('m_nome').value, bairro: $('m_bairro').value, endereco: $('m_end').value, ...novoPonto}, true);
  if (novoPino) novoPino.map = null;
  novoPino = novoPonto = null;
  $('m_local').textContent = 'clique no mapa';
  await carregarMaquinas();
  await atualizarProxima(false);
  await carregarAnalise();
  aviso('Máquina adicionada!');
});

const novoCupom = tentar(async () => {
  await api('/api/cupons', {marca: $('c_marca').value, descricao: $('c_desc').value, custo: $('c_custo').value}, true);
  await (user ? carregarUsuario(user.id) : carregarVisitante());
  aviso('Cupom adicionado como nova fase!');
});

const depositar = tentar(async () => {
  if (!user || !nearest) throw new Error('Entre numa conta de usuário e defina a localização antes.');
  const r = await api('/api/depositos', {usuario_id: user.id, maquina_id: nearest.id, material: $('d_mat').value, quantidade: $('d_qtd').value}, true);
  aviso(`+${r.pontos} pontos!`);
  await atualizarProxima(false);
  await carregarAnalise();
  await carregarUsuario(user.id);   // se liberou fase nova, o avatar anda até ela
});

/* ---------- ações do usuário ---------- */
const resgatar = tentar(async id => {
  const f = fasesAtuais.find(x => x.id === id);
  const r = await api('/api/resgatar', {usuario_id: user.id, cupom_id: id});
  $('codigoMarca').textContent = `${f.marca}: ${f.descricao}`;
  $('codigo').textContent = r.codigo;
  $('dlgCodigo').showModal();
  await carregarUsuario(user.id);
});

$('formLogin').addEventListener('submit', tentar(async e => {
  e.preventDefault();
  const u = await api('/api/login', {email: $('email').value, nome: $('nome').value});
  await carregarUsuario(u.id);
}));

$('formAdmin').addEventListener('submit', tentar(async e => {
  e.preventDefault();
  await entrarAdmin($('token').value);
  $('dlgAdmin').close();
}));

(async function iniciar() {   // roda mesmo se o Google Maps não carregar
  let t = null;
  try { t = sessionStorage.getItem('adminToken'); } catch {}
  if (t) entrarAdmin(t, true).catch(() => {});   // em paralelo com a animação do avatar
  const uid = ler('uid');
  try { await (uid ? carregarUsuario(uid) : carregarVisitante()); }
  catch { guardar('uid', null); await carregarVisitante().catch(() => {}); }
})();
</script>
