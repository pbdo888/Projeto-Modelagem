<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReciclaVerde</title>
<style>
  :root { --tinta:#12281e; --folha:#2f7d4f; --ticket:#f4d35e; --papel:#fbfcfa; --linha:#d6ddd8; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:flex; background:var(--papel); color:var(--tinta);
         font:15px/1.5 "Segoe UI", system-ui, sans-serif; }
  aside { width:390px; padding:20px; overflow-y:auto; border-right:1px solid var(--linha); }
  #map { flex:1; }
  h1 { margin:0 0 16px; font-size:24px; letter-spacing:-.01em; }
  h2 { margin:0 0 8px; font-size:16px; }
  section { padding:16px 0; border-top:1px solid var(--linha); }
  small { color:#5b6b61; }
  .linha { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:6px 0; }
  .ticket { margin-bottom:6px; padding:12px 14px; border:2px dashed var(--folha); border-radius:6px; background:#fff; }
  .barra { height:12px; margin:10px 0; border-radius:2px; background:#e7ece8; overflow:hidden; }
  .barra i { display:block; height:100%; background:var(--ticket); }
  input, select, button { font:inherit; padding:8px 10px; border:1px solid var(--linha); border-radius:4px; }
  input, select { width:100%; margin-bottom:6px; background:#fff; }
  button { border-color:var(--folha); background:var(--folha); color:#fff; cursor:pointer; white-space:nowrap; }
  button:disabled { border-color:var(--linha); background:#e7ece8; color:#6b786f; cursor:not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid var(--ticket); outline-offset:1px; }
  summary { padding:6px 0; font-weight:600; cursor:pointer; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:5px 6px; text-align:right; border-bottom:1px solid var(--linha); }
  th:first-child, td:first-child { text-align:left; }
  @media (max-width:800px) {
    body { flex-direction:column-reverse; }
    aside { width:100%; height:55vh; }
    #map { flex:none; height:45vh; }
  }
</style>
</head>
<body>
<aside>
  <h1>ReciclaVerde</h1>

  <section>
    <div id="login">
      <h2>Entrar</h2>
      <input id="email" type="email" placeholder="seu e-mail">
      <input id="nome" placeholder="seu nome (só no primeiro acesso)">
      <button onclick="entrar()">Entrar</button>
    </div>
    <div id="usuario" hidden></div>
  </section>

  <section>
    <h2>Máquinas mais próximas</h2>
    <div id="proxima">Permita a localização ou clique no mapa para dizer onde você está.</div>
  </section>

  <section>
    <h2>Cupons de parceiros</h2>
    <div id="cupons"></div>
  </section>

  <section>
    <h2>Reciclagem por bairro</h2>
    <table id="analise"></table>
  </section>

  <section>
    <h2>Admin e demonstração</h2>
    <input id="token" type="password" placeholder="token de admin">
    <details>
      <summary>Nova máquina (clique no mapa para escolher o local)</summary>
      <input id="m_nome" placeholder="Nome">
      <input id="m_bairro" placeholder="Bairro">
      <input id="m_end" placeholder="Endereço">
      <button onclick="novaMaquina()">Adicionar máquina</button>
    </details>
    <details>
      <summary>Novo cupom</summary>
      <input id="c_marca" placeholder="Marca parceira">
      <input id="c_desc" placeholder="Descrição">
      <input id="c_custo" type="number" min="1" placeholder="Custo em pontos">
      <button onclick="novoCupom()">Adicionar cupom</button>
    </details>
    <details>
      <summary>Simular depósito na máquina mais próxima</summary>
      <select id="d_mat">{% for m, p in materiais.items() %}<option value="{{ m }}">{{ m|upper }} ({{ p }} pontos por item)</option>{% endfor %}</select>
      <input id="d_qtd" type="number" min="1" value="3">
      <button onclick="depositar()">Depositar</button>
    </details>
  </section>
</aside>
<div id="map"></div>

<script>
let map, AME, Pin, me, rota, userPos, novoPonto, user, nearest, pinos = [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tentar = fn => async (...a) => { try { await fn(...a); } catch (e) { alert(e.message); } };

async function api(url, body, admin) {
  const headers = {'Content-Type': 'application/json'};
  if (admin) headers['X-Admin-Token'] = $('token').value;
  const r = await fetch(url, body ? {method: 'POST', headers, body: JSON.stringify(body)} : undefined);
  const j = await r.json();
  if (!r.ok) throw new Error(j.erro || 'Erro inesperado');
  return j;
}

function marcador(pos, cor, titulo) {
  const pin = new Pin({background: cor, borderColor: '#fff', glyphColor: '#fff'});
  return new AME({map, position: pos, title: titulo, content: pin.element ?? pin});
}

async function carregarMaquinas() {
  pinos.forEach(p => p.map = null);
  pinos = (await api('/api/maquinas')).map(m => marcador({lat: m.lat, lng: m.lng}, '#2f7d4f', m.nome));
}

async function definirPosicao(lat, lng) {
  userPos = {lat, lng};
  if (me) me.map = null;
  me = marcador(userPos, '#1a73e8', 'Você está aqui');
  await atualizarProxima(true);
}

async function atualizarProxima(ajustar) {
  if (!userPos) return;
  const lista = await api(`/api/maquinas/proximas?lat=${userPos.lat}&lng=${userPos.lng}`);
  nearest = lista[0];
  $('proxima').innerHTML = lista.map((m, i) =>
    `<div class="linha"><span>${i ? '' : '<b>Mais próxima: </b>'}${esc(m.nome)}<br><small>${esc(m.bairro)}, ${Math.round(100 * m.ocupacao / m.capacidade)}% cheia</small></span><b>${m.distancia_km} km</b></div>`
  ).join('');
  const alvo = {lat: nearest.lat, lng: nearest.lng};
  if (rota) rota.setMap(null);
  rota = new google.maps.Polyline({map, path: [userPos, alvo], strokeColor: '#2f7d4f', strokeWeight: 3});
  if (ajustar) {
    const b = new google.maps.LatLngBounds();
    b.extend(userPos);
    b.extend(alvo);
    map.fitBounds(b, 80);
  }
}

async function carregarUsuario(id) {
  const p = await api(`/api/usuarios/${id}/progresso`);
  user = p.usuario;
  localStorage.setItem('uid', user.id);
  $('login').hidden = true;
  $('usuario').hidden = false;
  const c = p.proximo_cupom;
  $('usuario').innerHTML =
    `<div class="ticket"><div class="linha"><b>${esc(user.nome)}</b><b>${user.pontos} pontos</b></div>` +
    (c ? `<div class="barra"><i style="width:${Math.min(100, 100 * user.pontos / c.custo)}%"></i></div>
          Faltam <b>${p.faltam_pontos} pontos</b> (cerca de ${p.faltam_itens} itens) para <b>${esc(c.marca)}</b>: ${esc(c.descricao)}.`
       : 'Você já alcançou todos os cupons disponíveis.') +
    `</div><small><a href="#" onclick="sair()">Sair</a></small>`;
  await carregarCupons();
}

async function carregarCupons() {
  const cs = await api('/api/cupons');
  $('cupons').innerHTML = cs.map(c => {
    const ok = user && user.pontos >= c.custo;
    return `<div class="linha"><span><b>${esc(c.marca)}</b><br><small>${esc(c.descricao)}</small></span>` +
           `<button ${ok ? '' : 'disabled'} onclick="resgatar(${c.id})">${ok ? 'Resgatar por ' + c.custo : c.custo + ' pontos'}</button></div>`;
  }).join('');
}

async function carregarAnalise() {
  const a = await api('/api/analise');
  $('analise').innerHTML = '<tr><th>Bairro</th><th>Itens</th><th>Pontos</th><th>Usuários</th></tr>' +
    a.por_bairro.map(b => `<tr><td>${esc(b.bairro)}</td><td>${b.itens}</td><td>${b.pontos}</td><td>${b.usuarios}</td></tr>`).join('');
}

function sair() { localStorage.removeItem('uid'); location.reload(); }

const entrar = tentar(async () => {
  const u = await api('/api/login', {email: $('email').value, nome: $('nome').value});
  await carregarUsuario(u.id);
});

const resgatar = tentar(async id => {
  const r = await api('/api/resgatar', {usuario_id: user.id, cupom_id: id});
  alert('Cupom resgatado! Código: ' + r.codigo);
  await carregarUsuario(user.id);
});

const novaMaquina = tentar(async () => {
  if (!novoPonto) throw new Error('Clique no mapa para escolher o local da máquina.');
  await api('/api/maquinas', {nome: $('m_nome').value, bairro: $('m_bairro').value, endereco: $('m_end').value, ...novoPonto}, true);
  await carregarMaquinas();
  await atualizarProxima(false);
  await carregarAnalise();
  alert('Máquina adicionada!');
});

const novoCupom = tentar(async () => {
  await api('/api/cupons', {marca: $('c_marca').value, descricao: $('c_desc').value, custo: $('c_custo').value}, true);
  await carregarCupons();
  alert('Cupom adicionado!');
});

const depositar = tentar(async () => {
  if (!user || !nearest) throw new Error('Entre na sua conta e defina sua localização antes.');
  const r = await api('/api/depositos', {usuario_id: user.id, maquina_id: nearest.id, material: $('d_mat').value, quantidade: $('d_qtd').value}, true);
  alert(`+${r.pontos} pontos!`);
  await carregarUsuario(user.id);
  await atualizarProxima(false);
  await carregarAnalise();
});

async function initMap() {
  const {Map} = await google.maps.importLibrary('maps');
  ({AdvancedMarkerElement: AME, PinElement: Pin} = await google.maps.importLibrary('marker'));
  map = new Map($('map'), {center: {lat: -23.5505, lng: -46.6333}, zoom: 12, mapId: 'DEMO_MAP_ID'});
  map.addListener('click', tentar(async e => {
    novoPonto = {lat: e.latLng.lat(), lng: e.latLng.lng()};
    await definirPosicao(novoPonto.lat, novoPonto.lng);
  }));
  await carregarMaquinas();
  carregarCupons();
  carregarAnalise();
  navigator.geolocation?.getCurrentPosition(p => definirPosicao(p.coords.latitude, p.coords.longitude));
  const uid = localStorage.getItem('uid');
  if (uid) carregarUsuario(uid).catch(() => localStorage.removeItem('uid'));
}
</script>
<script async src="https://maps.googleapis.com/maps/api/js?key={{ maps_key }}&loading=async&callback=initMap"></script>
</body>
</html>
