<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>McCrea — Home</title>
<script>/* mesmo tema do app (localStorage "tema"); sem escolha salva, segue o sistema */
try { const t = localStorage.getItem("tema"); if (t) document.documentElement.dataset.tema = t; } catch {}
document.documentElement.classList.toggle("noite", document.documentElement.dataset.tema
  ? document.documentElement.dataset.tema === "escuro" : matchMedia("(prefers-color-scheme: dark)").matches);</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♻️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,700;0,800;0,900;1,900&display=swap" rel="stylesheet">
<style>
:root{
  --glass: rgba(24, 32, 56, .80);
  --glass-line: rgba(255, 255, 255, .17);
  --green: #2FA85A;
  --green-deep: #238A49;
  --blue: #5B9BF0;
  --ink: #3A4152;
  --paper: #FFFFFF;
  --font: "Nunito", ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Segoe UI", system-ui, sans-serif;
  --chao: #E3B095;
}
.noite{--chao:#62516B;color-scheme:dark}   /* = #E3B095 com o luar do script */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--chao);font-family:var(--font);color:#fff;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ---------- cena ---------- */
.scene{position:fixed;inset:0;overflow:hidden;background:var(--chao)}
.world{position:absolute;left:50%;top:50%;width:1600px;height:830px;margin:-415px 0 0 -800px;
  transform:scale(var(--s,1));transform-origin:50% 50%}
.world > svg{position:absolute;left:0;top:0;width:1600px;height:830px;overflow:visible;font-family:var(--font)}
.world > .bg{z-index:0}
.world > .fg{z-index:2000;pointer-events:none}
.actor{position:absolute;left:0;top:0}
.actor > svg{position:absolute;overflow:visible}

/* pessoas */
.p > svg{left:-14px;top:-48px;width:28px;height:52px;transform:scale(var(--k,1));transform-origin:14px 48px}
.p.left .flip{transform:scaleX(-1)}
.p .leg,.p .arm,.p .head,.p .mouth{transform-box:fill-box}
.p .leg{transform-origin:50% 6%}
.p .arm{transform-origin:50% 8%}
.p .head{transform-origin:50% 92%}
.p .mouth{transform-origin:50% 50%}
.p.walk .bob{animation:bob .55s ease-in-out infinite alternate;animation-delay:var(--d)}
.p.walk .leg.a{animation:step 1.1s ease-in-out infinite alternate;animation-delay:var(--d)}
.p.walk .leg.b{animation:step 1.1s ease-in-out infinite alternate-reverse;animation-delay:var(--d)}
.p.walk .arm.a{animation:swing 1.1s ease-in-out infinite alternate-reverse;animation-delay:var(--d)}
.p.walk .arm.b{animation:swing 1.1s ease-in-out infinite alternate;animation-delay:var(--d)}
.p.talk .head{animation:chat .46s ease-in-out infinite alternate}
.p.talk .mouth{animation:mouth .23s ease-in-out infinite alternate}
.p.talk .arm.b{animation:gesture 1.5s ease-in-out infinite}
.p.nod .head{animation:nod .6s ease-in-out 2}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-1.1px)}}
@keyframes step{from{transform:rotate(-21deg)}to{transform:rotate(21deg)}}
@keyframes swing{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes chat{from{transform:rotate(-4deg) translateY(0)}to{transform:rotate(5deg) translateY(-.7px)}}
@keyframes mouth{from{transform:scaleY(1)}to{transform:scaleY(3.2)}}
@keyframes gesture{0%,100%{transform:rotate(0)}30%{transform:rotate(-62deg)}55%{transform:rotate(-38deg)}75%{transform:rotate(-66deg)}}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg) translateY(.6px)}}

/* indicador de quem está falando */
.dots{position:absolute;left:-13px;top:-66px;width:26px;height:15px;border-radius:9px;background:#fff;
  display:none;align-items:center;justify-content:center;gap:3px;box-shadow:0 2px 5px rgba(70,35,20,.22)}
.dots::after{content:"";position:absolute;left:50%;bottom:-3px;width:7px;height:7px;background:#fff;transform:translateX(-50%) rotate(45deg)}
.dots b{position:relative;z-index:1;width:3.5px;height:3.5px;border-radius:50%;background:#7C8496;animation:dot .9s ease-in-out infinite}
.dots b:nth-child(2){animation-delay:.15s}.dots b:nth-child(3){animation-delay:.3s}
.p.talk:not(.said) .dots{display:flex}
@keyframes dot{0%,100%{transform:translateY(0);opacity:.55}40%{transform:translateY(-2.5px);opacity:1}}

/* selos flutuantes */
.pin{z-index:1900}
.pin > svg{left:-34px;top:-88px;width:68px;height:88px;filter:drop-shadow(0 7px 7px rgba(80,40,25,.28));animation:float 3.6s ease-in-out infinite alternate}
.pin:nth-of-type(odd) > svg{animation-duration:4.3s}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-7px)}}

.bulb{animation:tw 1.3s steps(1) infinite}
.bulb.b2{animation-delay:-.65s}
@keyframes tw{0%{opacity:1}50%{opacity:.35}}

/* ---------- noite: postes acendem (piscando, cada um no seu tempo) ---------- */
.glow{display:none;mix-blend-mode:screen;pointer-events:none}
.noite .glow{display:block}
.noite .glow > svg,.noite .lampada{animation:acende 1.3s linear var(--d,0s) both}
@keyframes acende{0%,8%{opacity:.08}11%{opacity:.9}15%{opacity:.15}24%{opacity:1}28%{opacity:.3}40%,100%{opacity:1}}
.noite .p > svg{filter:brightness(.7) saturate(.8)}
.noite .pin > svg{filter:brightness(.8) drop-shadow(0 7px 7px rgba(10,10,40,.35))}
::view-transition-old(root),::view-transition-new(root){animation-duration:.8s}

/* ---------- balões de fala ---------- */
.talks{position:fixed;inset:0;pointer-events:none;z-index:5}
.bubble{position:absolute;left:0;top:0}
.bubble > div{position:absolute;left:0;bottom:13px;width:max-content;max-width:13.4em;padding:.62em 1em .7em;
  background:var(--paper);color:var(--ink);font-weight:800;font-size:var(--bf,14px);line-height:1.22;text-align:center;
  border-radius:14px;box-shadow:0 7px 16px rgba(80,40,25,.24),0 0 0 1px rgba(80,40,25,.06);
  transform-origin:var(--tx,50%) 100%;animation:pop .34s cubic-bezier(.2,1.5,.4,1) both}
.bubble > div::after{content:"";position:absolute;left:var(--tx,50%);bottom:-6px;width:14px;height:14px;background:var(--paper);
  border-radius:0 0 3px 0;transform:translateX(-50%) rotate(45deg);box-shadow:4px 4px 6px rgba(80,40,25,.10)}
.bubble.out > div{animation:unpop .22s ease-in both}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes unpop{to{transform:scale(.7);opacity:0}}

/* ---------- barra superior ---------- */
.bar{position:fixed;z-index:10;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  width:min(1480px,calc(100% - 28px));height:62px;padding:0 10px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--glass);border:1px solid var(--glass-line);border-radius:18px;
  -webkit-backdrop-filter:blur(10px) saturate(1.25);backdrop-filter:blur(10px) saturate(1.25);
  box-shadow:0 10px 28px rgba(60,30,20,.28),inset 0 1px 0 rgba(255,255,255,.10)}
.brand{display:flex;align-items:center;gap:11px;border-radius:12px}
.logo{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(180deg,#43C46F,#279A50);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 6px rgba(0,0,0,.25)}
.logo svg{width:24px;height:24px}
.name{font-size:27px;font-weight:900;letter-spacing:-.01em;color:#DCEBFF}
.auth{display:flex;align-items:center;gap:10px}
.btn{height:40px;min-width:112px;padding:0 20px;display:grid;place-items:center;border-radius:20px;font-size:15px;font-weight:800;white-space:nowrap;
  transition:transform .12s ease,filter .12s ease}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(64,108,186,.55);border:1.5px solid #77A9F0;color:#EAF2FF}
.btn.solid{background:linear-gradient(180deg,#3FBE6C,#279A50);border:1.5px solid rgba(255,255,255,.28);box-shadow:0 3px 10px rgba(20,90,45,.4)}
.tema{flex:none;width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:50%;cursor:pointer;
  background:rgba(64,108,186,.55);border:1.5px solid #77A9F0;color:#EAF2FF;transition:transform .12s ease,filter .12s ease}
.tema:hover{filter:brightness(1.1)}.tema:active{transform:scale(.94)}
.tema svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tema .sol,.noite .tema .lua{display:none}.noite .tema .sol{display:block}
.me{width:44px;height:44px;border-radius:13px;overflow:hidden;background:#DDE8F5;border:2px solid rgba(255,255,255,.75);display:block;flex:none}
.me svg{width:100%;height:100%;display:block}

/* ---------- navegação inferior ---------- */
.tabs{position:fixed;z-index:10;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;gap:7px;padding:8px;background:var(--glass);border:1px solid var(--glass-line);border-radius:22px;
  -webkit-backdrop-filter:blur(10px) saturate(1.25);backdrop-filter:blur(10px) saturate(1.25);
  box-shadow:0 10px 28px rgba(60,30,20,.30),inset 0 1px 0 rgba(255,255,255,.10)}
.tab{width:66px;height:56px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#D5DEEE;font-size:11.5px;font-weight:800;
  transition:background .15s ease,transform .12s ease}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{background:rgba(255,255,255,.14)}.tab:active{transform:scale(.96)}
.tab[aria-current="page"]{background:linear-gradient(180deg,rgba(111,170,245,.75),rgba(70,130,220,.65));border-color:#9CC4F8;color:#fff;
  box-shadow:0 0 0 3px rgba(91,155,240,.18)}

@media (max-width:640px){
  .bar{height:56px;padding:0 8px 0 10px;border-radius:16px}
  .logo{width:34px;height:34px}.name{font-size:21px}
  .brand{gap:8px;min-width:0}
  .auth{gap:8px}
  .btn{height:36px;min-width:0;padding:0 12px;font-size:13.5px}
  .me{display:none}
  .tema{width:36px;height:36px}
  .tab{width:58px;height:52px;font-size:10.5px}
}
@media (max-width:420px){.name{display:none}}
@media (max-width:380px){.auth{gap:6px}.btn{padding:0 11px;font-size:13px}.tabs{gap:5px;padding:6px}.tab{width:54px}}

@media (prefers-reduced-motion: reduce){
  .p *, .pin > svg, .bulb, .dots b, .bubble > div, .glow > svg, .lampada{animation:none !important}
}
</style>
</head>

<script>
(function () {
'use strict';

/* Falas da praça. Para usar as do banco, defina window.MCCREA_FALAS (uma lista de textos)
   num script antes deste. Sem isso, valem as falas de exemplo abaixo. */
const FALAS = (Array.isArray(window.MCCREA_FALAS) && window.MCCREA_FALAS.length) ? window.MCCREA_FALAS : [
  'Reciclei 10kg hoje!',
  'Este ponto na Paulista está limpo!',
  'Quem quer trocar dicas?',
  'Mais um cupom desbloqueado!',
  'McCrea mudou minha forma de reciclar!',
  'Faltam 20 pontos pro cinema!',
  'Tampinha vai no plástico?',
  'Hoje eu trouxe só vidro.',
  'Peguei o cupom do Café Verde!',
  'A máquina leu tudo de primeira.',
  'Bora reciclar junto amanhã?',
  'Lata amassada também vale ponto.',
  'Primeira vez aqui, gostei!',
  'Juntei garrafa a semana inteira.'
];
const PESSOAS = 62;      // gente conversando em grupos
const PASSEANDO = 8;     // gente andando pelo caminho
const VELOCIDADE = 21;   // px por segundo (andar devagar)

/* ---------- projeção isométrica ---------- */
const W = 1600, H = 830, K = 8.8, S = 3.52, Z = 8, OX = 800, OY = 140, SQ = S / K;
const world = document.getElementById('world');
const talks = document.getElementById('talks');
const scene = document.getElementById('scene');
const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const r1 = n => Math.round(n * 10) / 10;
const r2 = n => Math.round(n * 100) / 100;
const P  = (x, y, z = 0) => [OX + (x - y) * K, OY + (x + y) * S - z * Z];   // mundo
const P0 = (x, y, z = 0) => [(x - y) * K, (x + y) * S - z * Z];             // relativo ao objeto
const pp = a => a.map(q => r1(q[0]) + ',' + r1(q[1])).join(' ');
const poly = (a, fill, ex = '') => `<polygon points="${pp(a)}" fill="${fill}" ${ex}/>`;
const mix = (h, t, a) => '#' + [1, 3, 5].map(n => {
  const p = parseInt(h.slice(n, n + 2), 16), q = parseInt(t.slice(n, n + 2), 16);
  return Math.round(p + (q - p) * a).toString(16).padStart(2, '0');
}).join('');
const dk = (h, a) => mix(h, '#3A1E24', a);
const lt = (h, a) => mix(h, '#FFF3E4', a);
const R = (x, y, w, h, fill, ex = '') => `<rect x="${r2(x)}" y="${r2(y)}" width="${r2(w)}" height="${r2(h)}" fill="${fill}" ${ex}/>`;
const LINE = 'stroke="rgba(70,35,35,.38)" stroke-width=".22"';
const faceL = (Q, x0, y1, zt, inner) => `<g transform="matrix(${K} ${S} 0 ${Z} ${Q(x0, y1, zt).map(r1).join(' ')})">${inner}</g>`;
const faceR = (Q, x1, y1, zt, inner) => `<g transform="matrix(${K} ${-S} 0 ${Z} ${Q(x1, y1, zt).map(r1).join(' ')})">${inner}</g>`;

function box(Q, x0, x1, y0, y1, z0, z1, c, top) {
  return poly([Q(x0, y1, z0), Q(x1, y1, z0), Q(x1, y1, z1), Q(x0, y1, z1)], dk(c, .22)) +
         poly([Q(x1, y1, z0), Q(x1, y0, z0), Q(x1, y0, z1), Q(x1, y1, z1)], c) +
         poly([Q(x0, y0, z1), Q(x1, y0, z1), Q(x1, y1, z1), Q(x0, y1, z1)], top || lt(c, .3));
}

const RC = 'M-2.08,-4.4 L0,-8 L2.91,-2.96 M0.49,-4.36 L2.91,-2.96 L2.91,-5.76';
const recycle = (c, sw = 2.3) => `<g fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"><path d="${RC}"/><path d="${RC}" transform="rotate(120)"/><path d="${RC}" transform="rotate(240)"/></g>`;

/* ---------- fachadas ---------- */
function wins(len, h, o = {}) {
  const { top = 1.6, bottom = 1.2, ww = 2.1, wh = 2.5, gx = 1.5, gy = 1.4, fill = '#FBE6B0' } = o;
  const cols = Math.max(1, Math.floor((len - gx) / (ww + gx)));
  const rows = Math.max(0, Math.floor((h - top - bottom + gy) / (wh + gy)));
  const px = (len - (cols * ww + (cols - 1) * gx)) / 2;
  let s = '';
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const x = px + c * (ww + gx), y = top + r * (wh + gy);
    s += R(x, y, ww, wh, fill, `rx=".25" ${LINE}`) + R(x, y + wh, ww, .35, 'rgba(70,35,35,.22)');
  }
  return s;
}
function front(len, h, o = {}) {
  const { win = '#FBE6B0', glass = '#C4E6EC', door = '#7A4638', shop = true } = o;
  let s = wins(len, h, { top: 1.6, bottom: shop ? 6.2 : 1.2, fill: win });
  if (shop) {
    const dw = 2.3, dx = len / 2 - dw / 2;
    s += R(1.1, h - 4.5, dx - 1.8, 3.6, glass, `rx=".3" ${LINE}`);
    s += R(dx + dw + .7, h - 4.5, len - dx - dw - 1.8, 3.6, glass, `rx=".3" ${LINE}`);
    s += R(dx, h - 4.7, dw, 4.7, door, 'rx=".25"') + R(dx + .4, h - 4.2, dw - .8, 1.9, lt(door, .55), 'rx=".15"');
  }
  return s + R(0, h - .55, len, .55, 'rgba(70,35,35,.22)');
}
function awnR(b, a, c, t, cols, d = 2.3, drop = 1.3) {

  const leg = (x, cls) => `<g class="leg ${cls}"><rect x="${x}" y="-15.5" width="4.7" height="14" rx="2.2" fill="${pants}"/><rect x="${x - .2}" y="-3.6" width="5.6" height="3.4" rx="1.6" fill="#2B2630"/></g>`;
  const arm = (x, cls, c, extra) => `<g class="arm ${cls}"><rect x="${x}" y="-29" width="4" height="12.4" rx="2" fill="${c}"/><circle cx="${x + 2}" cy="-17.4" r="1.9" fill="${skin}"/>${extra || ''}</g>`;
  return `<ellipse cx="0" cy="0" rx="9.5" ry="3.4" fill="rgba(110,50,30,.24)"/>
  <g class="flip"><g class="bob">
    ${leg(-5.2, 'a')}${leg(.5, 'b')}
    ${arm(-9, 'a', sleeve)}
    <path d="M-7 -29.5Q-7 -32 -4.5 -32H4.5Q7 -32 7 -29.5V-16Q7 -13.2 4.2 -13.2H-4.2Q-7 -13.2 -7 -16Z" fill="${shirt}"/>
    ${arm(4.6, 'b', sleeve, bag)}
    <g class="head">${hb}<circle cx="0" cy="-38" r="7.6" fill="${skin}"/>${hf}
      <circle cx="1.5" cy="-36.7" r=".95" fill="#2B2330"/><circle cx="5.2" cy="-36.7" r=".95" fill="#2B2330"/>
      <ellipse class="mouth" cx="3.5" cy="-33.5" rx="1.25" ry=".42" fill="#8A3F3F"/></g>
  </g></g>`;
}
function makePerson(x, y) {
  const el = document.createElement('div');
  el.className = 'actor p';
  const k = rnd(.9, 1.06);
  el.innerHTML = `<svg viewBox="-14 -48 28 52" style="--k:${r2(k)};--d:${r2(-Math.random() * 2)}s">${personSVG()}</svg><i class="dots"><b></b><b></b><b></b></i>`;
  world.appendChild(el);
  const a = { el, x, y, k, left: false, z: -1, st: 'chat', t: 0, speed: VELOCIDADE * rnd(.85, 1.2) };
  place(a);
  return a;
}
function place(a) {
  a.el.style.transform = `translate(${r1(a.x)}px,${r1(a.y)}px)`;
  const z = Math.round(a.y);
  if (z !== a.z) { a.z = z; a.el.style.zIndex = z; }
}
function face(a, left) { if (left !== a.left) { a.left = left; a.el.classList.toggle('left', left); } }

/* ---------- montagem ---------- */
world.innerHTML =
  `<svg class="bg" viewBox="0 0 ${W} ${H}">${backdrop()}</svg>` +
  `<svg class="fg" viewBox="0 0 ${W} ${H}">${foreground()}</svg>`;
let trail = document.getElementById('trail');   // trocado junto com o cenário no tema escuro
const ESTATICOS = [...world.querySelectorAll(':scope > svg')].map(el => ({ el, dia: el.innerHTML }));

const obstacles = [];
const addObstacle = (g, r) => { const [x, y] = P(g[0], g[1]); obstacles.push({ x, y, r }); };

const BINS = [
  { g: [11, 25], cols: ['#3FA65A'] },
  { g: [29, 13], cols: ['#3F7FD1'] },
  { g: [54, 73], cols: ['#F2B632', '#3F7FD1', '#3FA65A'] },
  { g: [75, 56], cols: ['#3F7FD1', '#3FA65A'] },
  { g: [93, 35], cols: ['#3FA65A'] }
];
for (const b of BINS) {
  const [x, y] = P(b.g[0], b.g[1]);
  actor('prop', x, y + 6, `<g transform="translate(0 -6)">${binGroup(b.cols)}</g>`);
  const start = -BIN_STEP * (b.cols.length - 1) / 2;
  b.cols.forEach((c, i) => addObstacle([b.g[0] + start + i * BIN_STEP, b.g[1]], 22));
}
[[3, 32, 0], [3, 60, 1], [34, 3, 0], [5, 5, 1], [112, 66, 0], [111, 19, 1], [3, 88, 0]].forEach(t => {
  const [x, y] = P(t[0], t[1]); actor('prop', x, y, tree(t[2])); addObstacle(t, 14);
});
[[66, 4], [3, 17], [114, 43], [17, 37], [53, 41], [103, 63], [22, 86]].forEach((t, i) => {
  const [x, y] = P(t[0], t[1]), d = `--d:${r2(.15 + i * .22 + Math.random() * .25)}s`;
  actor('prop', x, y, lamp()).style.cssText += d;
  const g = actor('glow', x, y, lampGlow());
  g.style.cssText += d; g.style.zIndex = 1890;   // acima das pessoas, abaixo dos selos
  addObstacle(t, 8);
});
[[236, 306, pinRecycle], [318, 552, pinBottle], [1452, 398, pinBottle]].forEach(p => actor('pin', p[0], p[1], p[2], 'viewBox="0 0 68 88"'));

/* pontos de encontro (coordenadas da grade da praça) */
const SPOTS = [
  { g: [11, 25], r: [42, 54], cap: 6 }, { g: [29, 13], r: [42, 54], cap: 6 },
  { g: [54, 73], r: [84, 98], cap: 8 }, { g: [75, 56], r: [60, 74], cap: 7 }, { g: [93, 35], r: [42, 54], cap: 6 },
  { g: [9, 45], r: [22, 34], cap: 5 },  { g: [60, 12], r: [24, 38], cap: 6 }, { g: [40, 32], r: [22, 34], cap: 5 },
  { g: [9, 68], r: [20, 32], cap: 4 },  { g: [32, 79], r: [22, 34], cap: 5 }, { g: [88, 66], r: [20, 32], cap: 4 },
  { g: [104, 52], r: [22, 34], cap: 5 }, { g: [97, 15], r: [22, 34], cap: 5 }, { g: [62, 90], r: [20, 32], cap: 4 },
  { g: [16, 8], r: [18, 28], cap: 3 },  { g: [72, 30], r: [22, 34], cap: 5 }, { g: [24, 50], r: [20, 32], cap: 4 },
  { g: [42, 56], r: [18, 28], cap: 3 }, { g: [80, 10], r: [18, 28], cap: 3 }
].map(s => {
  const [x, y] = P(s.g[0], s.g[1]), slots = [], a0 = Math.random() * 6.28;
  for (let i = 0; i < s.cap; i++) {
    const a = a0 + i / s.cap * 6.283 + rnd(-.25, .25), r = rnd(s.r[0], s.r[1]);
    slots.push({ x: x + Math.cos(a) * r, y: y + Math.sin(a) * r * SQ, who: null });
  }
  return { x, y, slots, members: [], speaker: null, last: null, timer: rnd(.2, 3) };
});
const freeSlot = s => s.slots.filter(q => !q.who);

const people = [];
let walkers = 0;
for (let i = 0; i < PESSOAS; i++) {
  const open = SPOTS.filter(s => freeSlot(s).length);
  if (!open.length) break;
  const s = pick(open), q = pick(freeSlot(s));
  const a = makePerson(q.x, q.y);
  a.spot = s; a.slot = q; q.who = a; s.members.push(a);
  a.t = rnd(3, 42);
  face(a, a.x > s.x);
  people.push(a);
}
const LEN = trail.getTotalLength(), U0 = LEN * .03, U1 = LEN * .95;
for (let i = 0; i < PASSEANDO; i++) {
  const a = makePerson(0, 0);
  a.st = 'stroll'; a.u = U0 + (U1 - U0) * (i + rnd(.1, .9)) / PASSEANDO; a.dir = Math.random() < .5 ? 1 : -1;
  a.off = [rnd(-11, 11), rnd(-5, 5)]; a.next = rnd(6, 20);
  const pt = trail.getPointAtLength(a.u); a.x = pt.x + a.off[0]; a.y = pt.y + a.off[1];
  if (!calm) a.el.classList.add('walk');
  face(a, a.dir < 0); place(a);
  people.push(a);
}

/* ---------- comportamento ---------- */
function leave(a) {
  if (walkers >= 13) { a.t = rnd(2, 7); return; }
  const open = SPOTS.filter(s => s !== a.spot && freeSlot(s).length);
  if (!open.length) { a.t = rnd(3, 8); return; }
  const from = a.spot, s = pick(open), q = pick(freeSlot(s));
  from.members.splice(from.members.indexOf(a), 1);
  if (from.speaker === a) { from.speaker = null; from.timer = rnd(.4, 1.5); }
  a.slot.who = null; a.spot = s; a.slot = q; q.who = a;
  a.st = 'walk'; a.t = 0; walkers++;
  a.el.classList.remove('talk', 'nod');
  a.el.classList.add('walk');
}
function arrive(a) {
  a.st = 'chat'; a.t = rnd(14, 46); walkers--;
  a.spot.members.push(a);
  a.el.classList.remove('walk');
  face(a, a.x > a.spot.x);
}
function walk(a, dt) {
  const q = a.slot;
  let dx = q.x - a.x, dy = (q.y - a.y) / SQ;
  const d = Math.hypot(dx, dy);
  a.t += dt;
  if (d < 2.5 || a.t > 150) { arrive(a); return; }
  let vx = dx / d, vy = dy / d;
  if (d > 14) for (const o of obstacles) {
    const ox = a.x - o.x, oy = (a.y - o.y) / SQ, od = Math.hypot(ox, oy), reach = o.r + 12;
    if (od < reach && od > .01) {
      const f = (reach - od) / reach, nx = ox / od, ny = oy / od;
      let tx = -ny, ty = nx;
      if (tx * vx + ty * vy < 0) { tx = -tx; ty = -ty; }
      vx += nx * f * 1.7 + tx * f * 1.5; vy += ny * f * 1.7 + ty * f * 1.5;
    }
  }
  const n = Math.hypot(vx, vy) || 1;
  vx /= n; vy /= n;
  a.x += vx * a.speed * dt; a.y += vy * a.speed * dt * SQ;
  if (Math.abs(vx) > .15) face(a, vx < 0);
  place(a);
}
function stroll(a, dt) {
  if (a.pause > 0) { a.pause -= dt; if (a.pause <= 0) a.el.classList.add('walk'); return; }
  a.next -= dt;
  const p0 = trail.getPointAtLength(a.u), p1 = trail.getPointAtLength(a.u + a.dir * 2);
  const dx = p1.x - p0.x, dy = p1.y - p0.y, g = Math.hypot(dx, dy / SQ) || 2;
  a.u += a.dir * a.speed * dt * 2 / g;
  let stop = a.next <= 0;
  if (a.u < U0 || a.u > U1) { a.u = Math.min(U1, Math.max(U0, a.u)); a.dir *= -1; stop = true; }
  if (stop) { a.pause = rnd(2, 5); a.next = rnd(9, 24); a.el.classList.remove('walk'); }
  a.x = p0.x + a.off[0]; a.y = p0.y + a.off[1];
  if (Math.abs(dx) > .3) face(a, dx < 0);
  place(a);
}
function converse(s, dt) {
  s.timer -= dt;
  if (s.timer > 0) return;
  if (s.speaker) { s.speaker.el.classList.remove('talk'); s.last = s.speaker; s.speaker = null; s.timer = rnd(.7, 2.6); return; }
  if (s.members.length < 2) { s.timer = 1.2; return; }
  const others = s.members.filter(m => m !== s.last), who = pick(others.length ? others : s.members);
  s.speaker = who; who.el.classList.add('talk'); s.timer = rnd(1.8, 3.6);
  const listener = pick(s.members.filter(m => m !== who));
  if (listener) { listener.el.classList.add('nod'); setTimeout(() => listener.el.classList.remove('nod'), 1300); }
}

/* ---------- falas pontuais ---------- */
let scale = 1, vw = 0, vh = 0;
const toScreen = (x, y) => [vw / 2 + (x - W / 2) * scale, vh / 2 + (y - H / 2) * scale];
const bubbles = [];
let recent = [], bubbleClock = .3, seeded = 0;
const maxBubbles = () => vw < 640 ? 2 : vw < 1050 ? 3 : 4;

function layoutBubble(b) {
  const [sx, sy] = toScreen(b.who.x, b.who.y - 50 * b.who.k);
  const w = b.box.offsetWidth, left = Math.min(Math.max(sx - w / 2, 8), vw - w - 8);
  b.sx = sx; b.sy = sy;
  b.el.style.transform = `translate(${r1(left)}px,${r1(sy)}px)`;
  b.box.style.setProperty('--tx', r1(Math.min(Math.max(sx - left, 16), w - 16)) + 'px');
}
function say() {
  if (bubbles.length >= maxBubbles()) return;
  const cand = people.filter(a => {
    if (a.st !== 'chat' || a.spot.members.length < 2 || a.said) return false;
    const [sx, sy] = toScreen(a.x, a.y - 50);
    if (sx < 86 || sx > vw - 86 || sy < 150 || sy > vh - 104) return false;
    return !bubbles.some(b => Math.abs(b.sx - sx) < 200 && Math.abs(b.sy - sy) < 78);
  });
  if (!cand.length) return;
  const a = pick(cand), pool = FALAS.filter(f => !recent.includes(f)), text = pick(pool.length ? pool : FALAS);
  recent.push(text); if (recent.length > Math.min(6, FALAS.length - 1)) recent.shift();
  const el = document.createElement('div'); el.className = 'bubble';
  const box = document.createElement('div'); box.textContent = text; el.appendChild(box); talks.appendChild(el);
  const life = rnd(4.4, 6.4), b = { el, box, who: a, life };
  const s = a.spot;
  if (s.speaker && s.speaker !== a) s.speaker.el.classList.remove('talk');
  s.speaker = a; s.timer = life; a.said = true; a.t = Math.max(a.t, life + 1.5);
  a.el.classList.add('talk', 'said');
  layoutBubble(b); bubbles.push(b);
}
function ageBubbles(dt) {
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i]; b.life -= dt;
    if (b.life <= 0) {
      bubbles.splice(i, 1);
      b.who.said = false; b.who.el.classList.remove('said');
      b.el.classList.add('out'); setTimeout(() => b.el.remove(), 260);
    }
  }
  bubbleClock -= dt;
  if (bubbleClock <= 0) { say(); bubbleClock = seeded++ < 3 ? .55 : rnd(2.2, 4.4); }
}

/* ---------- tela ---------- */
function fit() {
  vw = scene.clientWidth; vh = scene.clientHeight;
  scale = Math.max(vw / W, vh / H);
  world.style.setProperty('--s', scale);
  talks.style.setProperty('--bf', r1(Math.min(vw < 640 ? 13 : 15, Math.max(11.5, 17 * scale))) + 'px');
  bubbles.forEach(layoutBubble);
}
window.addEventListener('resize', fit);
fit();

/* ---------- tema escuro: a praça à noite ---------- */
// Cada cor do cenário é multiplicada por um azul de fim de noite. Lâmpadas e letreiros
// continuam acesos, e parte das janelas e vitrines acende (sempre as mesmas).
const LUAR = [110, 118, 184];
const ACESAS = new Set(['#FFE9A8', '#FFD772', '#FFD98A', '#FFF3D6']);
const JANELAS = { '#FBE6B0': '#FFD88A', '#FBDFA6': '#FFD27C', '#C4E6EC': '#FFE4AA' };
const hex6 = c => c.length === 4 ? '#' + [...c.slice(1)].map(h => h + h).join('') : c;
const luar = c => '#' + [1, 3, 5].map((n, i) => Math.round(parseInt(c.slice(n, n + 2), 16) * LUAR[i] / 255)
  .toString(16).padStart(2, '0')).join('');
function noturno(svg) {
  let semente = 11;
  const sorte = () => (semente = semente * 16807 % 2147483647) / 2147483647;
  return svg.replace(/#(?:[0-9a-f]{6}|[0-9a-f]{3})\b/gi, c => {
    c = hex6(c).toUpperCase();
    if (ACESAS.has(c)) return c;
    if (JANELAS[c]) return sorte() < .55 ? JANELAS[c] : luar(c);
    return luar(c);
  });
}

const raiz = document.documentElement, btnTema = document.getElementById('btnTema');
const sistemaEscuro = matchMedia('(prefers-color-scheme: dark)');
const escuro = () => raiz.dataset.tema ? raiz.dataset.tema === 'escuro' : sistemaEscuro.matches;
let noite = null;
function pintar() {
  const n = escuro();
  btnTema.setAttribute('aria-pressed', n);
  btnTema.setAttribute('aria-label', n ? 'Modo claro' : 'Modo escuro');
  if (n === noite) return;
  noite = n;
  raiz.classList.toggle('noite', n);
  for (const s of ESTATICOS) s.el.innerHTML = n ? noturno(s.dia) : s.dia;
  trail = document.getElementById('trail');
}
btnTema.addEventListener('click', () => {
  const novo = escuro() ? 'claro' : 'escuro';
  const aplicar = () => { raiz.dataset.tema = novo; try { localStorage.setItem('tema', novo); } catch {} pintar(); };
  if (calm || !document.startViewTransition) aplicar();
  else document.startViewTransition(aplicar).ready.catch(() => {});
});
sistemaEscuro.addEventListener('change', pintar);
addEventListener('storage', e => {   // trocou o tema no app em outra aba
  if (e.key !== 'tema') return;
  if (e.newValue) raiz.dataset.tema = e.newValue; else delete raiz.dataset.tema;
  pintar();
});
pintar();

if (calm) {
  for (const s of SPOTS) if (s.members.length > 1) pick(s.members).el.classList.add('talk');
  for (let i = 0; i < 3; i++) say();
} else {
  let last = performance.now();
  const frame = now => {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    for (const a of people) {
      if (a.st === 'chat') { a.t -= dt; if (a.t <= 0 && !a.said) leave(a); }
      else if (a.st === 'walk') walk(a, dt);
      else stroll(a, dt);
    }
    for (const s of SPOTS) converse(s, dt);
    ageBubbles(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
})();
</script>
