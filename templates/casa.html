<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>McCrea — Home</title>
<script>/* mesmo tema do app (localStorage "tema"); sem escolha salva, segue o sistema */
try { const t = localStorage.getItem("tema"); if (t) document.documentElement.dataset.tema = t; } catch {}
document.documentElement.classList.toggle("noite", document.documentElement.dataset.tema
  ? document.documentElement.dataset.tema === "escuro" : matchMedia("(prefers-color-scheme: dark)").matches);</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♻️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,700;0,800;0,900;1,900&display=swap" rel="stylesheet">
<style>
:root{
  --glass: rgba(24, 32, 56, .80);
  --glass-line: rgba(255, 255, 255, .17);
  --green: #2FA85A;
  --green-deep: #238A49;
  --blue: #5B9BF0;
  --ink: #3A4152;
  --paper: #FFFFFF;
  --font: "Nunito", ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Segoe UI", system-ui, sans-serif;
  --chao: #DFAD97;
}
.noite{--chao:#60506D;color-scheme:dark}   /* = #DFAD97 com o luar do script */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--chao);font-family:var(--font);color:#fff;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ---------- cena ---------- */
.scene{position:fixed;inset:0;overflow:hidden;background:var(--chao);touch-action:none;-webkit-user-select:none;user-select:none}
.scene.arrastavel{cursor:grab}
.scene.arrastando{cursor:grabbing}
/* luz da referência: bordas um pouco mais escuras, como numa foto */
.scene::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(ellipse 75% 70% at 50% 48%,rgba(80,30,40,0) 58%,rgba(80,30,40,.16) 100%)}
.noite .scene::after{background:radial-gradient(ellipse 75% 70% at 50% 48%,rgba(10,10,40,0) 55%,rgba(10,10,40,.32) 100%)}
.world{position:absolute;left:0;top:0;width:1600px;height:830px;transform-origin:0 0;will-change:transform}
.world > svg{position:absolute;left:0;top:0;width:1600px;height:830px;overflow:visible;font-family:var(--font)}
.world > .defs{width:0;height:0}
.world > .bg{z-index:0}
.world > .fg{z-index:9000;pointer-events:none}
.actor{position:absolute;left:0;top:0}
.actor > svg{position:absolute;overflow:visible}

/* pessoas */
.p > svg{left:-14px;top:-48px;width:28px;height:52px;transform:scale(var(--k,1));transform-origin:14px 48px}
.p.left .flip{transform:scaleX(-1)}
.p .leg,.p .arm,.p .head,.p .mouth{transform-box:fill-box}
.p .leg{transform-origin:50% 6%}
.p .arm{transform-origin:50% 8%}
.p .head{transform-origin:50% 92%}
.p .mouth{transform-origin:50% 50%}
.p.walk .bob{animation:bob .55s ease-in-out infinite alternate;animation-delay:var(--d)}
.p.walk .leg.a{animation:step 1.1s ease-in-out infinite alternate;animation-delay:var(--d)}
.p.walk .leg.b{animation:step 1.1s ease-in-out infinite alternate-reverse;animation-delay:var(--d)}
.p.walk .arm.a{animation:swing 1.1s ease-in-out infinite alternate-reverse;animation-delay:var(--d)}
.p.walk .arm.b{animation:swing 1.1s ease-in-out infinite alternate;animation-delay:var(--d)}
.p.talk .head{animation:chat .46s ease-in-out infinite alternate}
.p.talk .mouth{animation:mouth .23s ease-in-out infinite alternate}
.p.talk .arm.b{animation:gesture 1.5s ease-in-out infinite}
.p.nod .head{animation:nod .6s ease-in-out 2}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-1.1px)}}
@keyframes step{from{transform:rotate(-21deg)}to{transform:rotate(21deg)}}
@keyframes swing{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes chat{from{transform:rotate(-4deg) translateY(0)}to{transform:rotate(5deg) translateY(-.7px)}}
@keyframes mouth{from{transform:scaleY(1)}to{transform:scaleY(3.2)}}
@keyframes gesture{0%,100%{transform:rotate(0)}30%{transform:rotate(-62deg)}55%{transform:rotate(-38deg)}75%{transform:rotate(-66deg)}}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg) translateY(.6px)}}

/* indicador de quem está falando */
.dots{position:absolute;left:-13px;top:-66px;width:26px;height:15px;border-radius:9px;background:#fff;
  display:none;align-items:center;justify-content:center;gap:3px;box-shadow:0 2px 5px rgba(70,35,20,.22)}
.dots::after{content:"";position:absolute;left:50%;bottom:-3px;width:7px;height:7px;background:#fff;transform:translateX(-50%) rotate(45deg)}
.dots b{position:relative;z-index:1;width:3.5px;height:3.5px;border-radius:50%;background:#7C8496;animation:dot .9s ease-in-out infinite}
.dots b:nth-child(2){animation-delay:.15s}.dots b:nth-child(3){animation-delay:.3s}
.p.talk:not(.said) .dots{display:flex}
@keyframes dot{0%,100%{transform:translateY(0);opacity:.55}40%{transform:translateY(-2.5px);opacity:1}}

/* selos flutuantes (bolhas redondas com ícone) */
.pin{z-index:8800}
.pin > svg{left:-56px;top:-127px;width:112px;height:134px;filter:drop-shadow(0 8px 9px rgba(80,40,45,.30));animation:float 3.6s ease-in-out infinite alternate}
.pin:nth-of-type(odd) > svg{animation-duration:4.3s}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-7px)}}

/* lâmpadas do letreiro do cinema */
.bulb{animation:tw 1.3s steps(1) infinite}
.bulb.b2{animation-delay:-.65s}
@keyframes tw{0%{opacity:1}50%{opacity:.35}}

/* ---------- noite: o poste acende (piscando) ---------- */
.glow{display:none;mix-blend-mode:screen;pointer-events:none}
.noite .glow{display:block}
.noite .glow > svg,.noite .lampada{animation:acende 1.3s linear var(--d,0s) both}
@keyframes acende{0%,8%{opacity:.08}11%{opacity:.9}15%{opacity:.15}24%{opacity:1}28%{opacity:.3}40%,100%{opacity:1}}
.noite .p > svg{filter:brightness(.7) saturate(.8)}
.noite .pin > svg{filter:brightness(.8) drop-shadow(0 8px 9px rgba(10,10,40,.35))}
::view-transition-old(root),::view-transition-new(root){animation-duration:.8s}

/* ---------- balões de fala ---------- */
.talks{position:fixed;inset:0;pointer-events:none;z-index:5}
.bubble{position:absolute;left:0;top:0}
.bubble > div{position:absolute;left:0;bottom:13px;width:max-content;max-width:13.4em;padding:.62em 1em .7em;
  background:var(--paper);color:var(--ink);font-weight:800;font-size:var(--bf,14px);line-height:1.22;text-align:center;
  border-radius:14px;box-shadow:0 7px 16px rgba(80,40,25,.24),0 0 0 1px rgba(80,40,25,.06);
  transform-origin:var(--tx,50%) 100%;animation:pop .34s cubic-bezier(.2,1.5,.4,1) both}
.bubble > div::after{content:"";position:absolute;left:var(--tx,50%);bottom:-6px;width:14px;height:14px;background:var(--paper);
  border-radius:0 0 3px 0;transform:translateX(-50%) rotate(45deg);box-shadow:4px 4px 6px rgba(80,40,25,.10)}
.bubble.out > div{animation:unpop .22s ease-in both}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes unpop{to{transform:scale(.7);opacity:0}}

/* ---------- barra superior ---------- */
.bar{position:fixed;z-index:10;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  width:min(1480px,calc(100% - 28px));height:62px;padding:0 10px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--glass);border:1px solid var(--glass-line);border-radius:18px;
  -webkit-backdrop-filter:blur(10px) saturate(1.25);backdrop-filter:blur(10px) saturate(1.25);
  box-shadow:0 10px 28px rgba(60,30,20,.28),inset 0 1px 0 rgba(255,255,255,.10)}
.brand{display:flex;align-items:center;gap:11px;border-radius:12px}
.logo{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(180deg,#43C46F,#279A50);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 6px rgba(0,0,0,.25)}
.logo svg{width:24px;height:24px}
.name{font-size:27px;font-weight:900;letter-spacing:-.01em;color:#DCEBFF}
.auth{display:flex;align-items:center;gap:10px}
.btn{height:40px;min-width:112px;padding:0 20px;display:grid;place-items:center;border-radius:20px;font-size:15px;font-weight:800;white-space:nowrap;
  transition:transform .12s ease,filter .12s ease}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(64,108,186,.55);border:1.5px solid #77A9F0;color:#EAF2FF}
.btn.solid{background:linear-gradient(180deg,#3FBE6C,#279A50);border:1.5px solid rgba(255,255,255,.28);box-shadow:0 3px 10px rgba(20,90,45,.4)}
.tema{flex:none;width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:50%;cursor:pointer;
  background:rgba(64,108,186,.55);border:1.5px solid #77A9F0;color:#EAF2FF;transition:transform .12s ease,filter .12s ease}
.tema:hover{filter:brightness(1.1)}.tema:active{transform:scale(.94)}
.tema svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tema .sol,.noite .tema .lua{display:none}.noite .tema .sol{display:block}
.me{width:44px;height:44px;border-radius:13px;overflow:hidden;background:#DDE8F5;border:2px solid rgba(255,255,255,.75);display:block;flex:none}
.me svg{width:100%;height:100%;display:block}

/* ---------- navegação inferior ---------- */
.tabs{position:fixed;z-index:10;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;gap:7px;padding:8px;background:var(--glass);border:1px solid var(--glass-line);border-radius:22px;
  -webkit-backdrop-filter:blur(10px) saturate(1.25);backdrop-filter:blur(10px) saturate(1.25);
  box-shadow:0 10px 28px rgba(60,30,20,.30),inset 0 1px 0 rgba(255,255,255,.10)}
.tab{width:66px;height:56px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#D5DEEE;font-size:11.5px;font-weight:800;
  transition:background .15s ease,transform .12s ease}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{background:rgba(255,255,255,.14)}.tab:active{transform:scale(.96)}
.tab[aria-current="page"]{background:linear-gradient(180deg,rgba(111,170,245,.75),rgba(70,130,220,.65));border-color:#9CC4F8;color:#fff;
  box-shadow:0 0 0 3px rgba(91,155,240,.18)}

@media (max-width:640px){
  .bar{height:56px;padding:0 8px 0 10px;border-radius:16px}
  .logo{width:34px;height:34px}.name{font-size:21px}
  .brand{gap:8px;min-width:0}
  .auth{gap:8px}
  .btn{height:36px;min-width:0;padding:0 12px;font-size:13.5px}
  .me{display:none}
  .tema{width:36px;height:36px}
  .tab{width:58px;height:52px;font-size:10.5px}
}
@media (max-width:420px){.name{display:none}}
@media (max-width:380px){.auth{gap:6px}.btn{padding:0 11px;font-size:13px}.tabs{gap:5px;padding:6px}.tab{width:54px}}

@media (prefers-reduced-motion: reduce){
  .p *, .pin > svg, .bulb, .dots b, .bubble > div, .glow > svg, .lampada{animation:none !important}
}
</style>
</head>
<body>

<main class="scene" id="scene">
  <h1 class="sr">Home — Praça McCrea, onde a comunidade se encontra</h1>
  <div class="world" id="world" aria-hidden="true"></div>
  <div class="talks" id="talks" aria-hidden="true"></div>
</main>

<header class="bar">
  <a class="brand" href="{{ url_for('index') }}" aria-label="McCrea, início">
    <span class="logo">
      <svg viewBox="-12 -12 24 24" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-2.08,-4.4 L0,-8 L2.91,-2.96 M0.49,-4.36 L2.91,-2.96 L2.91,-5.76"/>
        <path d="M-2.08,-4.4 L0,-8 L2.91,-2.96 M0.49,-4.36 L2.91,-2.96 L2.91,-5.76" transform="rotate(120)"/>
        <path d="M-2.08,-4.4 L0,-8 L2.91,-2.96 M0.49,-4.36 L2.91,-2.96 L2.91,-5.76" transform="rotate(240)"/>
      </g></svg>
    </span>
    <span class="name">McCrea</span>
  </a>
  <div class="auth">
    <button class="tema" id="btnTema" type="button" aria-label="Modo escuro" aria-pressed="false">
      <svg class="lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <svg class="sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
    </button>
    <a class="btn ghost" href="{{ url_for('app_principal') }}#/entrar">Entrar</a>
    <a class="btn solid" href="{{ url_for('app_principal') }}#/cadastro">Criar conta</a>
    <a class="me" href="{{ url_for('app_principal') }}#/conta" aria-label="Meu perfil">
      <svg viewBox="0 0 44 44" aria-hidden="true">
        <rect width="44" height="44" fill="#DDE8F5"/>
        <path d="M8 46c0-9 6-14 14-14s14 5 14 14z" fill="#2FA85A"/>
        <circle cx="22" cy="20" r="10.5" fill="#F0C29E"/>
        <path d="M11.4 19.5C11 11 17 7.5 22.5 7.5c6 0 10.6 3.8 10.2 11-2.6-3.6-7-5.4-12-4.8-3.8.5-6.8 2.4-9.3 5.8z" fill="#4A3228"/>
        <circle cx="18.2" cy="21" r="1.25" fill="#2B2330"/><circle cx="25.8" cy="21" r="1.25" fill="#2B2330"/>
        <path d="M18.8 25.6q3.2 2.4 6.4 0" fill="none" stroke="#8A4B3C" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </a>
  </div>
</header>

<nav class="tabs" aria-label="Seções">
  <a class="tab" href="{{ url_for('index') }}" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 10v9.5h13V10M10 19.5v-5h4v5"/></svg>Home</a>
  <a class="tab" href="{{ url_for('app_principal') }}#/noticias"><svg viewBox="0 0 24 24"><path d="M4 5h13v14H6a2 2 0 0 1-2-2zM17 9h3v8a2 2 0 0 1-2 2M7.5 9h6M7.5 12.5h6M7.5 16h4"/></svg>Notícias</a>
  <a class="tab" href="{{ url_for('app_principal') }}#/conta"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4.5 20.5c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/></svg>Perfil</a>
  <a class="tab" href="{{ url_for('app_principal') }}#/admin"><svg viewBox="0 0 24 24"><path d="M6.5 11h11a1.5 1.5 0 0 1 1.5 1.5v6a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 18.5v-6A1.5 1.5 0 0 1 6.5 11zM8 11V7.5a4 4 0 0 1 8 0V11"/></svg>Admin</a>
</nav>

<script>
(function () {
'use strict';

/* Falas soltas da praça. Para usar as do banco, defina window.MCCREA_FALAS (uma lista de textos)
   num script antes deste. Sem isso, valem as falas de exemplo abaixo. As conversas (CONVERSAS) não mudam. */
const FALAS = (Array.isArray(window.MCCREA_FALAS) && window.MCCREA_FALAS.length) ? window.MCCREA_FALAS : [
  'Reciclei 10kg hoje!',
  'Este ponto na Paulista está limpo!',
  'Quem quer trocar dicas?',
  'Mais um cupom desbloqueado!',
  'McCrea mudou minha forma de reciclar!',
  'Faltam 20 pontos pro cinema!',
  'Tampinha vai no plástico?',
  'Hoje eu trouxe só vidro.',
  'Peguei o cupom do Café Verde!',
  'A máquina leu tudo de primeira.',
  'Bora reciclar junto amanhã?',
  'Lata amassada também vale ponto.',
  'Primeira vez aqui, gostei!',
  'Juntei garrafa a semana inteira.',
  'Garrafa PET vale 10 pontos!',
  'Vidro vale 20 pontos no McCrea!',
  'Papel também vale ponto!',
  'Cheguei na fase 4 do mapa de cupons!',
  'Reciclar vira desconto!',
  'Já tenho 300 pontos no McCrea.',
  'Juntei as latas da festa!',
  'Hoje é dia de trocar cupom!',
  'Bora encher a máquina hoje?',
  'O McCrea achou a máquina perto de casa.'
];
/* Conversas: falas que se alternam entre duas pessoas do mesmo grupo, uma resposta depois da outra.
   Estão separadas pelos lugares onde nasceram; agora todas acontecem na praça (ver ROTEIROS),
   e as da escola ficam com a roda de crianças. Os números seguem o McCrea: PET 10, lata 15, vidro 20 e papel 5 pontos. */
const CONVERSAS = {
  geral: [
    ['Como o McCrea sabe o que eu reciclei?', 'Infravermelho e câmera leem o material.', 'E os pontos caem no app na hora!'],
    ['Quanto vale uma lata?', '15 pontos. E vidro vale 20!', 'Vou juntar os potes de geleia, então.'],
    ['Passei pra fase 3 do mapa de cupons!', 'Qual cupom liberou?', 'R$ 10 de desconto no Mercado Bom Preço.'],
    ['Por que o nome McCrea?', 'É o comandante do filme WALL-E.', 'O que trouxe todo mundo de volta pra Terra!'],
    ['Reciclar dá mesmo desconto?', 'Dá! Cada item vira ponto, e ponto vira cupom.'],
    ['Sabia que o Brasil recicla só 8,7% do lixo?', 'Com máquina na esquina isso muda.'],
    ['Quase toda lata no Brasil é reciclada.', 'Porque ela vale dinheiro na hora!', 'O McCrea faz isso com toda embalagem.'],
    ['Preciso lavar a embalagem?', 'Uma enxaguada rápida já ajuda.'],
    ['Juntei 1.500 pontos!', 'Dá pra pizza grátis na Pizzaria Forno!', 'O jantar hoje é por conta da reciclagem.'],
    ['Onde fica a máquina mais perto?', 'O McCrea calcula pelo endereço da sua casa.', 'Sem GPS ligado? Gostei!'],
    ['Minha vó não tinha onde reciclar.', 'Agora tem máquina McCrea perto da casa dela.'],
    ['Tampinha vai no plástico?', 'Vai, sim: tampinha também é plástico.'],
  ],
  praca: [
    ['Que praça limpa hoje!', 'Todo mundo leva as garrafas pra máquina.'],
    ['Quem quer trocar dicas?', 'Eu! Amasse a lata: cabe mais na máquina.', 'E vale os mesmos 15 pontos!'],
  ],
  civico: [
    ['Vou no Banco de Cupons trocar meus pontos.', 'Já dá pro ingresso 2x1 do Cinema Mais?', 'Dá! Custa 250 e eu tenho 310.'],
    ['Leu na banca? A lei exige logística reversa.', 'É a Lei 12.305, de 2010.', 'E cada máquina é um ponto de entrega oficial.'],
    ['Até 2029, um ponto de entrega a cada 10 mil pessoas.', 'Então vai ter máquina McCrea em todo bairro!'],
    ['Só 2,85% do lixo de SP vem da coleta seletiva.', 'E a meta era 10%... bora ajudar!'],
    ['A prefeitura cedeu lugar pra mais máquinas.', 'Menos lixo indo pro aterro!'],
  ],
  casas: [
    ['Separou o lixo da semana?', 'Papel, PET e lata, tudo separado.', 'Amanhã levo na máquina antes do trabalho.'],
    ['Cadastrei o endereço de casa no McCrea.', 'E ele já mostrou a máquina mais próxima?', 'A 800 metros! Dá pra ir a pé.'],
    ['Meu filho que pediu pra gente reciclar.', 'Aprendeu na Escola McCrea?', 'Agora ele confere até as tampinhas!'],
    ['Aqui em casa somos em cinco.', 'É muita embalagem virando ponto!'],
  ],
  reciclagem: [
    ['Coloquei a garrafa e a tela mostrou: PET!', 'É a visão computacional reconhecendo.', '+10 pontos na hora!'],
    ['Essa máquina está quase cheia.', 'O painel avisa e o coletador vem esvaziar.'],
    ['Pra onde vai tudo isso?', 'Pras cooperativas, já separado.', 'Fica bem mais fácil fazer a triagem.'],
    ['Quantas máquinas o McCrea tem?', 'Olha no mapa: aparecem todas lá.'],
    ['A máquina registra até o bairro?', 'Registra item, material, data e local.', 'Mas o meu nome a marca não vê.'],
  ],
  comercio: [
    ['Paguei o café com garrafa PET!', 'Como assim?', 'Cupom de 10% do Café Verde, com 100 pontos.'],
    ['Vim aqui só por causa do cupom.', 'Eu também nunca tinha entrado nessa loja.', 'É assim que a loja ganha cliente novo.'],
    ['Qual o próximo cupom do meu mapa?', 'Bike Sampa: um dia de bike grátis.', 'Faltam só 120 pontos!'],
    ['A Livraria Folha dá 20% com o McCrea.', 'Vou trocar meus 900 pontos lá!'],
    ['A loja paga alguma coisa pro McCrea?', 'Só quando o cupom vira venda.'],
    ['Por que tem loja "Em breve"?', 'Ainda faltam marcas parceiras no bairro.'],
  ],
  escola: [

/* ---------- projeção isométrica ---------- */
const W = 1600, H = 830, K = 8.8, S = 3.52, Z = 8, OX = 800, OY = 140, SQ = S / K;
const world = document.getElementById('world');
const talks = document.getElementById('talks');
const scene = document.getElementById('scene');
const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const r1 = n => Math.round(n * 10) / 10;
const r2 = n => Math.round(n * 100) / 100;
const P  = (x, y, z = 0) => [OX + (x - y) * K, OY + (x + y) * S - z * Z];   // mundo
const P0 = (x, y, z = 0) => [(x - y) * K, (x + y) * S - z * Z];             // relativo ao objeto
const pp = a => a.map(q => r1(q[0]) + ',' + r1(q[1])).join(' ');
const poly = (a, fill, ex = '') => `<polygon points="${pp(a)}" fill="${fill}" ${ex}/>`;
const mix = (h, t, a) => '#' + [1, 3, 5].map(n => {
  const p = parseInt(h.slice(n, n + 2), 16), q = parseInt(t.slice(n, n + 2), 16);
  return Math.round(p + (q - p) * a).toString(16).padStart(2, '0');
}).join('');
const dk = (h, a) => mix(h, '#3A1E24', a);
const lt = (h, a) => mix(h, '#FFF3E4', a);
const R = (x, y, w, h, fill, ex = '') => `<rect x="${r2(x)}" y="${r2(y)}" width="${r2(w)}" height="${r2(h)}" fill="${fill}" ${ex}/>`;
const faceL = (Q, x0, y1, zt, inner) => `<g transform="matrix(${K} ${S} 0 ${Z} ${Q(x0, y1, zt).map(r1).join(' ')})">${inner}</g>`;
const faceR = (Q, x1, y1, zt, inner) => `<g transform="matrix(${K} ${-S} 0 ${Z} ${Q(x1, y1, zt).map(r1).join(' ')})">${inner}</g>`;
const quad = (x0, x1, y0, y1, c, ex) => poly([P(x0, y0), P(x1, y0), P(x1, y1), P(x0, y1)], c, ex);
const shadow = (cx, cy, rx, ry) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="rgba(110,50,40,.22)"/>`;

/* gradientes: cada par de cores vira um <linearGradient> só, todos guardados em DEFS */
let DEFS = `<radialGradient id="folha" cx=".36" cy=".3" r=".78"><stop offset="0" stop-color="#A6CF5E"/><stop offset=".45" stop-color="#6A9E3A"/><stop offset="1" stop-color="#3E6B28"/></radialGradient>` +
  `<radialGradient id="globo" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D3D9E4"/></radialGradient>` +
  `<radialGradient id="luzPraca" gradientUnits="userSpaceOnUse" cx="820" cy="470" r="880"><stop offset="0" stop-color="#E5B7A2"/><stop offset=".6" stop-color="#DFAD97"/><stop offset="1" stop-color="#D49F8B"/></radialGradient>` +
  `<filter id="borrao" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>`;
const GRADS = new Map();
function grad(c1, c2, deitado = false) {   // de cima para baixo (deitado: da esquerda para a direita)
  const k = c1 + c2 + deitado;
  if (!GRADS.has(k)) {
    const id = 'g' + GRADS.size;
    DEFS += `<linearGradient id="${id}" x1="0" y1="0" x2="${deitado ? 1 : 0}" y2="${deitado ? 0 : 1}"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`;
    GRADS.set(k, `url(#${id})`);
  }
  return GRADS.get(k);
}

// a luz vem da esquerda, como na referência: face L clara, face R na sombra, topo mais claro
function caixa(Q, x0, x1, y0, y1, z0, z1, c, top) {
  return poly([Q(x0, y1, z0), Q(x1, y1, z0), Q(x1, y1, z1), Q(x0, y1, z1)], c) +
         poly([Q(x1, y1, z0), Q(x1, y0, z0), Q(x1, y0, z1), Q(x1, y1, z1)], dk(c, .22)) +
         poly([Q(x0, y0, z1), Q(x1, y0, z1), Q(x1, y1, z1), Q(x0, y1, z1)], top || lt(c, .22));
}

const RC = 'M-2.08,-4.4 L0,-8 L2.91,-2.96 M0.49,-4.36 L2.91,-2.96 L2.91,-5.76';
const recycle = (c, sw = 2.3) => `<g fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"><path d="${RC}"/><path d="${RC}" transform="rotate(120)"/><path d="${RC}" transform="rotate(240)"/></g>`;

/* ---------- fachadas ---------- */
const VIDRO = '#5E6B8C', MADEIRA = '#7A3E2A';
function janela(x, y, w, h, o = {}) {
  const { m = MADEIRA, v = VIDRO, cruz = true } = o;
  let s = R(x - .3, y - .3, w + .6, h + .6, m, 'rx=".25"') + R(x, y, w, h, v, 'rx=".12"') +
    R(x + .2, y + .2, w * .36, h - .4, 'rgba(255,255,255,.12)', 'rx=".1"');
  if (cruz) s += R(x + w / 2 - .12, y, .24, h, m) + R(x, y + h * .45, w, .24, m);
  return s + R(x - .6, y + h + .2, w + 1.2, .55, dk(m, .12), 'rx=".2"');
}
function fileira(a, b, y, w, h, n, o) {   // n janelas iguais distribuídas entre a e b
  const passo = n > 1 ? (b - a - w) / (n - 1) : 0, x0 = n > 1 ? a : (a + b - w) / 2;
  let s = '';
  for (let i = 0; i < n; i++) s += janela(x0 + i * passo, y, w, h, o);
  return s;
}
const banda = (len, y, h, c) => R(0, y, len, h, c);
function awnR(b, a, c, t, cols, d = 2.3, drop = 1.3) {
  const { x1, y1, h } = b, n = Math.max(2, Math.round((c - a) / 1.5)); let s = '';
  for (let i = 0; i < n; i++) {
    const u0 = a + (c - a) * i / n, u1 = a + (c - a) * (i + 1) / n, col = dk(cols[i % cols.length], .08), z = h - t;
    s += poly([P(x1, y1 - u0, z), P(x1, y1 - u1, z), P(x1 + d, y1 - u1, z - drop), P(x1 + d, y1 - u0, z - drop)], col);
    s += poly([P(x1 + d, y1 - u0, z - drop), P(x1 + d, y1 - u1, z - drop), P(x1 + d, y1 - u1, z - drop - .8), P(x1 + d, y1 - u0, z - drop - .8)], dk(col, .14));
  }
  return s;
}
function awnL(b, a, c, t, cols, d = 2.3, drop = 1.3) {
  const { x0, y1, h } = b, n = Math.max(2, Math.round((c - a) / 1.5)); let s = '';
  for (let i = 0; i < n; i++) {
    const u0 = a + (c - a) * i / n, u1 = a + (c - a) * (i + 1) / n, col = cols[i % cols.length], z = h - t;
    s += poly([P(x0 + u0, y1, z), P(x0 + u1, y1, z), P(x0 + u1, y1 + d, z - drop), P(x0 + u0, y1 + d, z - drop)], col);
    s += poly([P(x0 + u0, y1 + d, z - drop), P(x0 + u1, y1 + d, z - drop), P(x0 + u1, y1 + d, z - drop - .8), P(x0 + u0, y1 + d, z - drop - .8)], dk(col, .12));
  }
  return s;
}

/* prédio de telhado plano: paredes com degradê, fachadas (L e R), mureta e laje afundada */
function predio(b) {
  const { x0, x1, y0, y1 } = b, zt = b.h + (b.par ?? 1), cL = b.cor, cR = b.corR || dk(b.cor, .18);
  let s = poly([P(x0, y1), P(x1, y1), P(x1, y1, zt), P(x0, y1, zt)], grad(lt(cL, .07), dk(cL, .07)));
  s += poly([P(x1, y1), P(x1, y0), P(x1, y0, zt), P(x1, y1, zt)], grad(lt(cR, .05), dk(cR, .1)));
  if (b.L) s += faceL(P, x0, y1, zt, b.L(x1 - x0, zt));
  if (b.R) s += faceR(P, x1, y1, zt, b.R(y1 - y0, zt));
  // contato com o chão e quina iluminada
  s += poly([P(x0, y1), P(x1, y1), P(x1, y1, .6), P(x0, y1, .6)], 'rgba(60,25,30,.16)') +
       poly([P(x1, y1), P(x1, y0), P(x1, y0, .6), P(x1, y1, .6)], 'rgba(60,25,30,.2)');
  s += `<path d="M${P(x1, y1).map(r1)} L${P(x1, y1, zt).map(r1)}" stroke="rgba(255,238,224,.32)" stroke-width="1.3"/>`;
  s += laje(b, zt);
  if (b.topo) s += b.topo(b, zt);
  return s;
}
function laje(b, zt) {
  const { x0, x1, y0, y1 } = b, aro = b.aro || lt(b.teto, .2), e = b.borda ?? 1.2, zi = zt - .42;
  const a0 = x0 + e, a1 = x1 - e, c0 = y0 + e, c1 = y1 - e;
  let s = poly([P(a0, c0, zi), P(a1, c0, zi), P(a1, c1, zi), P(a0, c1, zi)], grad(dk(b.teto, .06), lt(b.teto, .05)));
  s += poly([P(a0, c0, zi), P(a1, c0, zi), P(a1, c0, zt), P(a0, c0, zt)], dk(aro, .12));   // mureta do fundo, por dentro
  s += poly([P(a0, c0, zi), P(a0, c1, zi), P(a0, c1, zt), P(a0, c0, zt)], dk(aro, .28));
  const fora = [P(x0, y0, zt), P(x1, y0, zt), P(x1, y1, zt), P(x0, y1, zt)], dentro = [P(a0, c0, zt), P(a1, c0, zt), P(a1, c1, zt), P(a0, c1, zt)];
  return s + `<path d="M${pp(fora)}Z M${pp(dentro)}Z" fill="${aro}" fill-rule="evenodd"/>`;
}
const sombraPredio = b => quad(b.x0 - .6, b.x1 + 2.6, b.y0 - .6, b.y1 + 2.6, 'rgba(95,40,45,.30)', 'filter="url(#borrao)"');

/* pontos de encontro: onde os grupos conversam na referência */
const SPOT_DEFS = [
  { g: [8, 56], r: [26, 54], cap: 10 },     { g: [17, 33.5], r: [40, 62], cap: 9 },  { g: [9, 41], r: [20, 34], cap: 5 },
  { g: [36.9, 20.8], r: [44, 70], cap: 10 }, { g: [50, 9], r: [40, 80], cap: 14 },    { g: [66, 3], r: [20, 34], cap: 5 },
  { g: [40, 40], r: [30, 56], cap: 9 },     { g: [19, 71], r: [24, 46], cap: 7 },    { g: [60, 79], r: [62, 90], cap: 10 },
  { g: [79.4, 61], r: [56, 82], cap: 9 },   { g: [96.4, 37.6], r: [38, 58], cap: 7 }, { g: [52, 93], r: [24, 46], cap: 7 },
  { g: [85, 74], r: [26, 48], cap: 7 },     { g: [76, 26], r: [24, 46], cap: 7 },    { g: [95, 13], r: [22, 42], cap: 6 },
  { g: [103, 72], r: [22, 40], cap: 6 },    { g: [19, 89], r: [20, 34], cap: 5 },    { g: [34, 97], r: [20, 34], cap: 5 },
  { g: [38.6, 80.7], r: [22, 40], cap: 6 }, { g: [42.6, 54], r: [22, 40], cap: 6 },  { g: [54.5, 25], r: [22, 40], cap: 6 },
  { g: [93.7, 48.3], r: [22, 40], cap: 6 }, { g: [109, 27.3], r: [18, 32], cap: 5 }, { g: [71.6, 98.9], r: [20, 36], cap: 5 },
  { g: [82.4, 48.3], r: [18, 30], cap: 4 }, { g: [14.8, 98.9], r: [18, 30], cap: 4 },
  { g: [70, 40], r: [16, 26], cap: CRIANCAS, zona: 'escola', kids: true },
];
const SPOTS = SPOT_DEFS.map(s => {
  const [x, y] = P(s.g[0], s.g[1]), slots = [], a0 = Math.random() * 6.28;
  for (let i = 0; i < s.cap; i++) {
    const a = a0 + i / s.cap * 6.283 + rnd(-.25, .25), r = rnd(s.r[0], s.r[1]);
    slots.push({ x: x + Math.cos(a) * r, y: y + Math.sin(a) * r * SQ, who: null });
  }
  return { x, y, slots, zona: s.zona || 'praca', kids: !!s.kids, members: [], speaker: null, last: null, timer: rnd(.2, 3) };
});
const freeSlot = s => s.slots.filter(q => !q.who);

const people = [];
let walkers = 0;
for (const zona of ['praca', 'escola']) {
  const zs = SPOTS.filter(s => s.zona === zona), n = zona === 'praca' ? PESSOAS : CRIANCAS;
  for (let i = 0; i < n; i++) {
    const open = zs.filter(s => freeSlot(s).length);
    if (!open.length) break;
    const s = pick(open), q = pick(freeSlot(s));
    const a = makePerson(q.x, q.y, s.kids ? .74 : 1);
    a.spot = s; a.slot = q; q.who = a; s.members.push(a);
    a.t = rnd(3, 42);
    face(a, a.x > s.x);
    people.push(a);
  }
}
for (const tr of TRILHAS) {
  tr.a = tr.len * tr.u0; tr.b = tr.len * tr.u1;
  for (let i = 0; i < tr.n; i++) {
    const a = makePerson(0, 0);
    a.st = 'stroll'; a.tr = tr; a.u = tr.a + (tr.b - tr.a) * (i + rnd(.1, .9)) / tr.n; a.dir = Math.random() < .5 ? 1 : -1;
    a.off = [rnd(-11, 11), rnd(-5, 5)]; a.next = rnd(6, 20);
    const pt = ponto(tr, a.u); a.x = pt.x + a.off[0]; a.y = pt.y + a.off[1];
    if (!calm) a.el.classList.add('walk');
    face(a, a.dir < 0); place(a);
    people.push(a);
  }
}

/* ---------- comportamento ---------- */
function leave(a) {
  if (walkers >= 16) { a.t = rnd(2, 7); return; }
  const open = SPOTS.filter(s => s !== a.spot && s.zona === a.spot.zona && freeSlot(s).length);   // as crianças ficam na roda delas
  if (!open.length) { a.t = rnd(3, 8); return; }
  const from = a.spot, s = pick(open), q = pick(freeSlot(s));
  from.members.splice(from.members.indexOf(a), 1);
  if (from.speaker === a) { from.speaker = null; from.timer = rnd(.4, 1.5); }
  a.slot.who = null; a.spot = s; a.slot = q; q.who = a;
  a.st = 'walk'; a.t = 0; walkers++;
  a.el.classList.remove('talk', 'nod');
  a.el.classList.add('walk');
}
function arrive(a) {
  a.st = 'chat'; a.t = rnd(14, 46); walkers--;
  a.spot.members.push(a);
  a.el.classList.remove('walk');
  face(a, a.x > a.spot.x);
}
function walk(a, dt) {
  const q = a.slot;
  let dx = q.x - a.x, dy = (q.y - a.y) / SQ;
  const d = Math.hypot(dx, dy);
  a.t += dt;
  if (d < 2.5 || a.t > 150) { arrive(a); return; }
  let vx = dx / d, vy = dy / d;
  if (d > 14) for (const o of obstacles) {
    const ox = a.x - o.x, oy = (a.y - o.y) / SQ, od = Math.hypot(ox, oy), reach = o.r + 12;
    if (od < reach && od > .01) {
      const f = (reach - od) / reach, nx = ox / od, ny = oy / od;
      let tx = -ny, ty = nx;
      if (tx * vx + ty * vy < 0) { tx = -tx; ty = -ty; }
      vx += nx * f * 1.7 + tx * f * 1.5; vy += ny * f * 1.7 + ty * f * 1.5;
    }
  }
  const n = Math.hypot(vx, vy) || 1;
  vx /= n; vy /= n;
  a.x += vx * a.speed * dt; a.y += vy * a.speed * dt * SQ;
  if (Math.abs(vx) > .15) face(a, vx < 0);
  place(a);
}
function stroll(a, dt) {
  if (a.pause > 0) { a.pause -= dt; if (a.pause <= 0) a.el.classList.add('walk'); return; }
  a.next -= dt;
  const tr = a.tr, p0 = ponto(tr, a.u), p1 = ponto(tr, a.u + a.dir * 2);
  const dx = p1.x - p0.x, dy = p1.y - p0.y, g = Math.hypot(dx, dy / SQ) || 2;
  a.u += a.dir * a.speed * dt * 2 / g;
  let stop = a.next <= 0;
  if (a.u < tr.a || a.u > tr.b) { a.u = Math.min(tr.b, Math.max(tr.a, a.u)); a.dir *= -1; stop = true; }
  if (stop) { a.pause = rnd(2, 5); a.next = rnd(9, 24); a.el.classList.remove('walk'); }
  a.x = p0.x + a.off[0]; a.y = p0.y + a.off[1];
  if (Math.abs(dx) > .3) face(a, dx < 0);
  place(a);
}
function converse(s, dt) {
  s.timer -= dt;
  if (s.timer > 0) return;
  if (s.speaker) { s.speaker.el.classList.remove('talk'); s.last = s.speaker; s.speaker = null; s.timer = rnd(.7, 2.6); return; }
  if (s.members.length < 2) { s.timer = 1.2; return; }
  const others = s.members.filter(m => m !== s.last), who = pick(others.length ? others : s.members);
  s.speaker = who; who.el.classList.add('talk'); s.timer = rnd(1.8, 3.6);
  const listener = pick(s.members.filter(m => m !== who));
  if (listener) { listener.el.classList.add('nod'); setTimeout(() => listener.el.classList.remove('nod'), 1300); }
}

/* ---------- falas pontuais e conversas ---------- */
const bubbles = [], respostas = [];
let recent = [], roteirosRecentes = [], bubbleClock = .3, seeded = 0;
const maxBubbles = () => vw < 640 ? 2 : vw < 1050 ? 3 : 4;
const tempoDeLeitura = t => Math.min(7.2, Math.max(4.2, 2.6 + t.length * .07));   // segundos de balão

function layoutBubble(b) {
  const [sx, sy] = toScreen(b.who.x, b.who.y - 50 * b.who.k);
  const w = b.box.offsetWidth, left = Math.min(Math.max(sx - w / 2, 8), vw - w - 8);
  b.sx = sx; b.sy = sy;
  b.el.style.transform = `translate(${r1(left)}px,${r1(sy)}px)`;
  b.box.style.setProperty('--tx', r1(Math.min(Math.max(sx - left, 16), w - 16)) + 'px');
}
function naTela(a) {   // onde o balão da pessoa ficaria, ou null se cair fora da área livre da tela
  const [sx, sy] = toScreen(a.x, a.y - 50);
  return sx < 86 || sx > vw - 86 || sy < 150 || sy > vh - 104 ? null : [sx, sy];
}
function falar(a, text, conversa = null) {
  const el = document.createElement('div'); el.className = 'bubble';
  const box = document.createElement('div'); box.textContent = text; el.appendChild(box); talks.appendChild(el);
  const life = tempoDeLeitura(text), b = { el, box, who: a, life, conversa };
  const s = a.spot;
  if (s.speaker && s.speaker !== a) s.speaker.el.classList.remove('talk');
  s.speaker = a; s.timer = life; a.said = true; a.t = Math.max(a.t, life + 1.5);
  a.el.classList.add('talk', 'said');
  const ouvinte = conversa && conversa.falantes.find(p => p !== a);
  if (ouvinte) { ouvinte.el.classList.add('nod'); setTimeout(() => ouvinte.el.classList.remove('nod'), 1300); }
  layoutBubble(b); bubbles.push(b);
}
function say() {
  if (bubbles.length >= maxBubbles()) return;
  const cand = people.filter(a => {
    if (a.st !== 'chat' || a.spot.members.length < 2 || a.said || a.conversa) return false;
    const p = naTela(a);
    return p && !bubbles.some(b => Math.abs(b.sx - p[0]) < 200 && Math.abs(b.sy - p[1]) < 78);
  });
  if (!cand.length) return;
  const a = pick(cand), s = a.spot;
  const ouvintes = s.members.filter(m => m !== a && !m.said && !m.conversa);
  const roteiros = s.kids ? CONVERSAS.escola : ROTEIROS;
  if (!calm && ouvintes.length && roteiros.length && Math.random() < CHANCE_CONVERSA) {
    const livres = roteiros.filter(r => !roteirosRecentes.includes(r)), linhas = pick(livres.length ? livres : roteiros);
    roteirosRecentes.push(linhas); if (roteirosRecentes.length > 10) roteirosRecentes.shift();
    const b = pick(ouvintes), conversa = { linhas, i: 0, falantes: [a, b], spot: s };
    // os dois ficam no grupo até a última fala e se viram um para o outro
    const total = linhas.reduce((n, l) => n + tempoDeLeitura(l) + .5, 2);
    for (const p of conversa.falantes) { p.conversa = conversa; p.t = Math.max(p.t, total); }
    face(a, b.x < a.x); face(b, a.x < b.x);
    falar(a, linhas[0], conversa);
    return;
  }
  const pool = FALAS.filter(f => !recent.includes(f)), text = pick(pool.length ? pool : FALAS);
  recent.push(text); if (recent.length > Math.min(6, FALAS.length - 1)) recent.shift();
  falar(a, text);
}
function encerrar(conversa) { for (const p of conversa.falantes) if (p.conversa === conversa) p.conversa = null; }
function responder(conversa) {   // a próxima fala vai para o outro lado da conversa
  const i = conversa.i + 1, quem = conversa.falantes[i % 2];
  if (i >= conversa.linhas.length || quem.st !== 'chat' || quem.spot !== conversa.spot || quem.said || !naTela(quem)) {
    encerrar(conversa);
    return;
  }
  conversa.i = i;
  falar(quem, conversa.linhas[i], conversa);
}
function ageBubbles(dt) {
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i]; b.life -= dt;
    if (b.life <= 0) {
      bubbles.splice(i, 1);
      b.who.said = false; b.who.el.classList.remove('said');
      b.el.classList.add('out'); setTimeout(() => b.el.remove(), 260);
      if (b.conversa) respostas.push({ conversa: b.conversa, em: .35 });   // pausa curta antes da resposta
    }
  }
  for (let i = respostas.length - 1; i >= 0; i--) {
    if ((respostas[i].em -= dt) <= 0) responder(respostas.splice(i, 1)[0].conversa);
  }
  bubbleClock -= dt;
  if (bubbleClock <= 0) { say(); bubbleClock = seeded++ < 3 ? .55 : rnd(2.2, 4.4); }
}

/* ---------- tela: a praça cobre a tela inteira; se sobrar cena (no celular), dá para arrastar ---------- */
let vw = 0, vh = 0, escala = 1, arrasto = null;
const cam = { x: W / 2, y: H / 2 };
const toScreen = (x, y) => [vw / 2 + (x - cam.x) * escala, vh / 2 + (y - cam.y) * escala];
function aplicarCamera() {
  const hw = vw / 2 / escala, hh = vh / 2 / escala;
  cam.x = Math.min(W - hw, Math.max(hw, cam.x));
  cam.y = Math.min(H - hh, Math.max(hh, cam.y));
  world.style.transform = `translate(${r2(vw / 2 - cam.x * escala)}px,${r2(vh / 2 - cam.y * escala)}px) scale(${escala.toFixed(4)})`;
  bubbles.forEach(layoutBubble);
}
function fit() {
  vw = scene.clientWidth; vh = scene.clientHeight;
  escala = Math.max(vw / W, vh / H);
  talks.style.setProperty('--bf', r1(Math.min(vw < 640 ? 13 : 15, Math.max(11.5, 17 * escala))) + 'px');
  scene.classList.toggle('arrastavel', W * escala - vw > 40 || H * escala - vh > 40);
  aplicarCamera();
}
window.addEventListener('resize', fit);
scene.addEventListener('pointerdown', e => {
  if (!scene.classList.contains('arrastavel') || (e.pointerType === 'mouse' && e.button !== 0)) return;
  arrasto = { id: e.pointerId, x: e.clientX, y: e.clientY };
  scene.setPointerCapture(e.pointerId);
  scene.classList.add('arrastando');
});
scene.addEventListener('pointermove', e => {
  if (!arrasto || e.pointerId !== arrasto.id) return;
  cam.x -= (e.clientX - arrasto.x) / escala; cam.y -= (e.clientY - arrasto.y) / escala;
  arrasto.x = e.clientX; arrasto.y = e.clientY;
  aplicarCamera();
});
function soltar(e) { if (arrasto && e.pointerId === arrasto.id) { arrasto = null; scene.classList.remove('arrastando'); } }
scene.addEventListener('pointerup', soltar);
scene.addEventListener('pointercancel', soltar);
addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey || !e.key.startsWith('Arrow')) return;
  if (e.target.closest && e.target.closest('input, textarea, select')) return;
  const passo = 110 / escala;
  if (e.key === 'ArrowLeft') cam.x -= passo; else if (e.key === 'ArrowRight') cam.x += passo;
  else if (e.key === 'ArrowUp') cam.y -= passo; else cam.y += passo;
  aplicarCamera(); e.preventDefault();
});

/* ---------- tema escuro: a praça à noite ---------- */
// Cada cor do cenário é multiplicada por um azul de fim de noite. Lâmpadas e letreiros
// continuam acesos, e parte das janelas e vitrines acende (sempre as mesmas).
const LUAR = [110, 118, 184];
const ACESAS = new Set(['#FFE9A8', '#FFD772', '#FFF3D6', '#FFF1DE', '#F7CEA4', '#EB9836', '#FFFFFF']);
const JANELAS = { '#5E6B8C': '#FFD88A', '#6D7894': '#FFD27C', '#4F5C7C': '#FFE0A0', '#4D4660': '#FFD27C', '#7A8098': '#FFE4AA', '#4A4356': '#FFC977', '#8F7A86': '#FFE4AA' };
const hex6 = c => c.length === 4 ? '#' + [...c.slice(1)].map(h => h + h).join('') : c;
const luar = c => '#' + [1, 3, 5].map((n, i) => Math.round(parseInt(c.slice(n, n + 2), 16) * LUAR[i] / 255)
  .toString(16).padStart(2, '0')).join('');
function noturno(svg) {
  let semente = 11;
  const sorte = () => (semente = semente * 16807 % 2147483647) / 2147483647;
  return svg.replace(/#(?:[0-9a-f]{6}|[0-9a-f]{3})\b/gi, c => {
    c = hex6(c).toUpperCase();
    if (ACESAS.has(c)) return c;
    if (JANELAS[c]) return sorte() < .55 ? JANELAS[c] : luar(c);
    return luar(c);
  });
}
const DEFS_DIA = DEFS;   // todos os gradientes já foram criados (cenário, objetos e selos)
ESTATICOS.push({ el: defsEl, dia: `<defs>${DEFS_DIA}</defs>` });

const raiz = document.documentElement, btnTema = document.getElementById('btnTema');
const sistemaEscuro = matchMedia('(prefers-color-scheme: dark)');
const escuro = () => raiz.dataset.tema ? raiz.dataset.tema === 'escuro' : sistemaEscuro.matches;
function pintar() {
  const n = escuro();
  btnTema.setAttribute('aria-pressed', n);
  btnTema.setAttribute('aria-label', n ? 'Modo claro' : 'Modo escuro');
  if (n === noite) return;
  noite = n;
  raiz.classList.toggle('noite', n);
  for (const s of ESTATICOS) s.el.innerHTML = n ? noturno(s.dia) : s.dia;
}
btnTema.addEventListener('click', () => {
  const novo = escuro() ? 'claro' : 'escuro';
  const aplicar = () => { raiz.dataset.tema = novo; try { localStorage.setItem('tema', novo); } catch {} pintar(); };
  if (calm || !document.startViewTransition) aplicar();
  else document.startViewTransition(aplicar).ready.catch(() => {});
});
sistemaEscuro.addEventListener('change', pintar);
addEventListener('storage', e => {   // trocou o tema no app em outra aba
  if (e.key !== 'tema') return;
  if (e.newValue) raiz.dataset.tema = e.newValue; else delete raiz.dataset.tema;
  pintar();
});
pintar();
fit();

if (calm) {
  for (const s of SPOTS) if (s.members.length > 1) pick(s.members).el.classList.add('talk');
  for (let i = 0; i < 3; i++) say();
} else {
  let last = performance.now();
  const frame = now => {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    for (const a of people) {
      if (a.st === 'chat') { a.t -= dt; if (a.t <= 0 && !a.said) leave(a); }
      else if (a.st === 'walk') walk(a, dt);
      else stroll(a, dt);
    }
    for (const s of SPOTS) converse(s, dt);
    ageBubbles(dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
})();
